    <script>
        let managerPassword = "m123";
        let adminPassword = "a123";
        let rewardPointsPer100 = 5;

        let customers = []; 
        let currentCustomer = null; 
        let products = [];
        let cart = [];
        let orders = [];

        window.onload = function() {
            let savedLogo = localStorage.getItem('disha_app_logo');
            if(savedLogo) { 
                document.getElementById('brandLogoImg').src = savedLogo; 
            } else {
                document.getElementById('brandLogoImg').src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><circle cx="25" cy="25" r="23" fill="%230052D4"/><text x="25" y="30" font-size="14" fill="white" text-anchor="middle">LOGO</text></svg>';
            }

            let savedInnerLogo = localStorage.getItem('disha_inner_app_logo');
            if(savedInnerLogo) { 
                document.getElementById('innerCustomLogoImg').src = savedInnerLogo; 
            } else {
                document.getElementById('innerCustomLogoImg').src = document.getElementById('brandLogoImg').src;
            }

            let savedProducts = localStorage.getItem('disha_products');
            if(savedProducts) { products = JSON.parse(savedProducts); }

            let savedCustomers = localStorage.getItem('disha_customers');
            if(savedCustomers) { customers = JSON.parse(savedCustomers); }

            let savedOrders = localStorage.getItem('disha_orders');
            if(savedOrders) { 
                orders = JSON.parse(savedOrders); 
                orders.forEach((o, index) => {
                    if(!o.invoiceNo || o.invoiceNo === 'undefined' || o.invoiceNo === 'N/A') {
                        o.invoiceNo = 'INV-' + (9102601 + index);
                    }
                });
            }

            let activeCustPhone = localStorage.getItem('disha_active_customer');
            if(activeCustPhone) {
                let found = customers.find(c => c.phone === activeCustPhone);
                if(found) {
                    currentCustomer = found;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('customerPanel').classList.remove('hidden');
                    document.getElementById('topNavBar').classList.add('hidden');
                    document.getElementById('bottomManagerNav').classList.add('hidden');
                    updateCustomerDashboard();
                }
            }

            renderCustomerProducts();
        };

        function updateAppLogo() {
            let fileInput = document.getElementById('logoFile');
            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Image = e.target.result;
                    localStorage.setItem('disha_app_logo', base64Image);
                    document.getElementById('brandLogoImg').src = base64Image;
                    alert('বাইরের লোগো সফলভাবে আপডেট ও সেভ হয়েছে!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert('দয়া করে প্রথমে ফাইল থেকে একটি লোগো ছবি সিলেক্ট করুন!');
            }
        }

        function updateInnerLogo() {
            let fileInput = document.getElementById('innerLogoFile');
            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('disha_inner_app_logo', e.target.result);
                    document.getElementById('innerCustomLogoImg').src = e.target.result;
                    alert('অ্যাপের ভেতরের লোগো সফলভাবে সেট ও সেভ হয়েছে!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert('দয়া করে একটি লোগো ছবি সিলেক্ট করুন!');
            }
        }

        function toggleAuthMode(mode) {
            if(mode === 'register') {
                document.getElementById('authTitle').innerText = "📝 নতুন কাস্টমার রেজিস্ট্রেশন";
                document.getElementById('loginFormDiv').classList.add('hidden');
                document.getElementById('registerFormDiv').classList.remove('hidden');
            } else {
                document.getElementById('authTitle').innerText = "👤 কাস্টমার অ্যাকাউন্ট লগইন";
                document.getElementById('registerFormDiv').classList.add('hidden');
                document.getElementById('loginFormDiv').classList.remove('hidden');
            }
        }

        function registerCustomer() {
            let name = document.getElementById('regName').value.trim();
            let phone = document.getElementById('regPhone').value.trim();
            let pass = document.getElementById('regPass').value.trim();
            let address = document.getElementById('regAddress').value.trim();
            let affiliate = document.getElementById('regAffiliate').value.trim();

            if(!name || !phone || !pass || !address) { alert('সব ফিল্ড পূরণ করুন!'); return; }
            if(customers.some(c => c.phone === phone)) { alert('এই নম্বরে ইতিমধ্যে অ্যাকাউন্ট আছে!'); return; }

            let uniqueId = affiliate || ("16" + Math.floor(10000 + Math.random() * 90000));
            let newCust = { id: uniqueId, name: name, phone: phone, pass: pass, address: address, affiliateRef: affiliate || 'None', rewardPoints: 0, totalOrdersCount: 0 };

            customers.push(newCust);
            localStorage.setItem('disha_customers', JSON.stringify(customers));
            alert('রেজিস্ট্রেশন সফল! আপনার আইডি: ' + uniqueId);
            toggleAuthMode('login');
        }

        function loginCustomer() {
            let phone = document.getElementById('loginPhone').value.trim();
            let pass = document.getElementById('loginPass').value.trim();
            let found = customers.find(c => c.phone === phone && c.pass === pass);

            if(found) {
                currentCustomer = found;
                localStorage.setItem('disha_active_customer', found.phone);
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('customerPanel').classList.remove('hidden');
                document.getElementById('topNavBar').classList.add('hidden');
                document.getElementById('bottomManagerNav').classList.add('hidden');

                updateCustomerDashboard();
                renderCustomerProducts();
                alert('স্বাগতম, ' + currentCustomer.name + '!');
            } else {
                alert('ভুল মোবাইল নম্বর বা পাসওয়ার্ড!');
            }
        }

        function logoutCustomer() {
            currentCustomer = null;
            localStorage.removeItem('disha_active_customer');
            document.getElementById('customerPanel').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('topNavBar').classList.remove('hidden');
            document.getElementById('bottomManagerNav').classList.remove('hidden');
            cart = [];
            updateCartUI();
        }

        function logoutStaff() { switchTab('customer'); }

        function updateCustomerDashboard() {
            if(!currentCustomer) return;
            document.getElementById('profileCustName').innerText = currentCustomer.name;
            document.getElementById('profileCustId').innerText = currentCustomer.id;
            document.getElementById('statReward').innerText = currentCustomer.rewardPoints + " Pt";
            if(currentCustomer.address) {
                document.getElementById('cartDeliveryAddress').value = currentCustomer.address;
            }
        }

        function renderCustomerProducts() {
            let container = document.getElementById('customerProductList');
            if(!container) return;
            if(products.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 13px; grid-column: span 2;">বর্তমানে কোনো পণ্য নেই।</p>';
                return;
            }
            let html = '';
            products.forEach(p => {
                let imgTag = p.image ? `<img src="${p.image}" class="product-img-box" alt="Product">` : `<div class="product-img-box" style="display:flex; align-items:center; justify-content:center; color:#888; font-size:12px;">ছবি নেই</div>`;
                html += `
                    <div class="product-item">
                        <div class="discount-badge">${p.discount || ''}</div>
                        ${imgTag}
                        <div class="product-name">${p.name}</div>
                        <div class="product-size">সাইজ: <b>${p.size || ''}</b></div>
                        <div class="price-box">
                            <span class="current-price">৳ ${p.price}</span>
                            <span class="old-price">৳ ${p.oldPrice || ''}</span>
                        </div>
                        <button class="btn" style="padding: 5px 8px; font-size: 11px; width: 100%;" onclick="addToCart(${p.id})">🛒 অর্ডার নাও</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderAdminProductList() {
            let container = document.getElementById('adminProductList');
            if(!container) return;
            if(products.length === 0) { container.innerHTML = '<p>কোনো পণ্য নেই।</p>'; return; }
            let html = '<table style="width:100%; border-collapse: collapse;" border="1"><tr><th style="padding:5px;">ছবি</th><th>নাম</th><th>মূল্য</th><th>অ্যাকশন</th></tr>';
            products.forEach(p => {
                let imgThumb = p.image ? `<img src="${p.image}" style="width:30px; height:30px; object-fit:cover;">` : 'নেই';
                html += `<tr>
                    <td style="padding:5px; text-align:center;">${imgThumb}</td>
                    <td style="padding:5px;">${p.name}</td>
                    <td style="padding:5px; color:#28a745; font-weight:bold;">৳ ${p.price}</td>
                    <td style="padding:5px; text-align:center;">
                        <button class="btn btn-warning" style="padding: 2px 5px; font-size: 10px;" onclick="editProduct(${p.id})">এডিট</button>
                        <button class="btn btn-danger" style="padding: 2px 5px; font-size: 10px;" onclick="deleteProduct(${p.id})">ডিলিট</button>
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        function saveOrUpdateProduct() {
            let editId = document.getElementById('editProductId').value;
            let name = document.getElementById('pName').value.trim();
            let price = document.getElementById('pPrice').value.trim();
            let oldPrice = document.getElementById('pOldPrice').value.trim();
            let discount = document.getElementById('pDiscount').value.trim();
            let size = document.getElementById('pSize').value.trim();
            let imageFile = document.getElementById('pImageFile').files[0];

            if(!name || !price) { alert('নাম ও মূল্য দিন!'); return; }

            if(imageFile) {
                let reader = new FileReader();
                reader.onload = function(e) { 
                    processProductSave(editId, name, price, oldPrice, discount, size, e.target.result); 
                };
                reader.readAsDataURL(imageFile);
            } else {
                let existingImage = editId !== "" ? (products.find(prod => String(prod.id) === String(editId))?.image || '') : '';
                processProductSave(editId, name, price, oldPrice, discount, size, existingImage);
            }
        }

        function processProductSave(editId, name, price, oldPrice, discount, size, imgData) {
            if(editId !== "") {
                let p = products.find(prod => String(prod.id) === String(editId));
                if(p) {
                    p.name = name; 
                    p.price = Number(price); 
                    p.oldPrice = Number(oldPrice) || 0;
                    p.discount = discount || ''; 
                    p.size = size || 'Standard'; 
                    if(imgData) p.image = imgData;
                }
                alert('পণ্য সফলভাবে আপডেট হয়েছে!');
            } else {
                let newProd = { 
                    id: Date.now(), 
                    name: name, 
                    price: Number(price), 
                    oldPrice: Number(oldPrice) || 0, 
                    discount: discount || '', 
                    size: size || 'Standard', 
                    image: imgData 
                };
                products.push(newProd);
                alert('নতুন পণ্য সফলভাবে যোগ হয়েছে!');
            }
            
            localStorage.setItem('disha_products', JSON.stringify(products));
            resetProductForm();
            renderCustomerProducts();
            renderAdminProductList();
        }

        function editProduct(id) {
            let p = products.find(prod => String(prod.id) === String(id));
            if(p) {
                document.getElementById('editProductId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pOldPrice').value = p.oldPrice || '';
                document.getElementById('pDiscount').value = p.discount || '';
                document.getElementById('pSize').value = p.size || '';
                document.getElementById('productFormTitle').innerText = "✏️ পণ্য এডিট করুন";
                document.getElementById('saveProductBtn').innerText = "আপডেট করুন";
                document.getElementById('cancelEditBtn').classList.remove('hidden');
                window.scrollTo({ top: document.getElementById('productFormCard').offsetTop, behavior: 'smooth' });
            }
        }

        function deleteProduct(id) {
            if(confirm('সত্যিই এই পণ্যটি ডিলিট করতে চান?')) {
                products = products.filter(p => String(p.id) !== String(id));
                localStorage.setItem('disha_products', JSON.stringify(products));
                renderCustomerProducts();
                renderAdminProductList();
                alert('পণ্যটি সফলভাবে ডিলিট করা হয়েছে!');
            }
        }

        function resetProductForm() {
            document.getElementById('editProductId').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pOldPrice').value = '';
            document.getElementById('pDiscount').value = '';
            document.getElementById('pSize').value = '';
            document.getElementById('pImageFile').value = '';
            document.getElementById('productFormTitle').innerText = "➕ নতুন পণ্য যোগ করুন";
            document.getElementById('saveProductBtn').innerText = "পণ্য প্রকাশ করুন";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function addToCart(id) {
            let item = products.find(p => String(p.id) === String(id));
            if(item) {
                cart.push(item);
                updateCartUI();
                alert('পণ্যটি কার্টে যোগ করা হয়েছে!');
            }
        }

        function updateCartUI() {
            let container = document.getElementById('cartItems');
            if(!container) return;
            if(cart.length === 0) { container.innerHTML = 'কার্ট খালি আছে।'; return; }
            let html = '<ul style="padding-left: 15px;">', total = 0;
            cart.forEach((c, idx) => {
                html += `<li><b>${c.name}</b> - ৳ ${c.price} <button onclick="removeFromCart(${idx})" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">[বাদ]</button></li>`;
                total += c.price;
            });
            html += `</ul><p style="margin-top:8px; font-weight:bold; color: #0052D4;">মোট দাম: ৳ ${total}</p>`;
            container.innerHTML = html;
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }

        function sendOrder() {
            if(cart.length === 0) { alert('কার্ট খালি আছে!'); return; }
            if(!currentCustomer) { alert('দয়া করে আগে লগইন করুন!'); return; }

            let deliveryAddress = document.getElementById('cartDeliveryAddress').value.trim();
            if(!deliveryAddress) { alert('ডেলিভারির ঠিকানা লিখুন!'); return; }

            currentCustomer.address = deliveryAddress;

            let orderTotal = cart.reduce((sum, i) => sum + i.price, 0);
            let earnedReward = Math.floor(orderTotal / 100) * rewardPointsPer100;
            currentCustomer.rewardPoints += earnedReward;
            currentCustomer.totalOrdersCount += 1;

            let invoiceNo = 'INV-' + Math.floor(100000 + Math.random() * 900000);

            let newOrder = {
                id: Date.now(), 
                invoiceNo: invoiceNo,
                customerName: currentCustomer.name, 
                customerId: currentCustomer.id,
                customerPhone: currentCustomer.phone, 
                customerAddress: deliveryAddress,
                affiliate: currentCustomer.affiliateRef || 'None',
                items: [...cart], 
                total: orderTotal, 
                orderTime: new Date().toLocaleString(),
                adminApproved: false
            };

            orders.push(newOrder);
            localStorage.setItem('disha_orders', JSON.stringify(orders));

            let cIndex = customers.findIndex(c => c.id === currentCustomer.id);
            if(cIndex !== -1) { 
                customers[cIndex] = currentCustomer; 
                localStorage.setItem('disha_customers', JSON.stringify(customers)); 
            }

            cart = []; 
            updateCartUI(); 
            updateCustomerDashboard();
            alert(`অর্ডার সফলভাবে কনফার্ম হয়েছে! (Invoice No: ${invoiceNo})`);
            renderAdminOrders();
        }

        function openManagerLogin() { 
            let pass = prompt("ম্যানেজার পাসওয়ার্ড দিন:");
            if(pass === managerPassword) { switchTab('manager'); } 
            else if(pass !== null) { alert('ভুল পাসওয়ার্ড!'); }
        }

        function openAdminLogin() { 
            let pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
            if(pass === adminPassword) { 
                switchTab('admin'); 
                renderAdminCustomers(); 
                renderAdminProductList(); 
                renderAdminOrders(); 
            } else if(pass !== null) { alert('ভুল পাসওয়ার্ড!'); }
        }

        function switchTab(tab) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('customerPanel').classList.add('hidden');
            document.getElementById('managerPanel').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('viewModal').classList.add('hidden');

            if(tab === 'customer') {
                if(currentCustomer) {
                    document.getElementById('customerPanel').classList.remove('hidden');
                    document.getElementById('topNavBar').classList.add('hidden');
                    document.getElementById('bottomManagerNav').classList.add('hidden');
                } else {
                    document.getElementById('authSection').classList.remove('hidden');
                    document.getElementById('topNavBar').classList.remove('hidden');
                    document.getElementById('bottomManagerNav').classList.remove('hidden');
                }
            } else if(tab === 'manager') { 
                document.getElementById('managerPanel').classList.remove('hidden'); 
                renderManagerOrders(); 
            } else if(tab === 'admin') { 
                document.getElementById('adminPanel').classList.remove('hidden'); 
                renderAdminCustomers();
                renderAdminProductList();
                renderAdminOrders();
            }
        }

        function renderAdminCustomers() {
            let container = document.getElementById('adminCustomerList');
            if(!container) return;
            if(customers.length === 0) { container.innerHTML = '<p>কাস্টমার নেই।</p>'; return; }
            let html = '<table style="width:100%; border-collapse:collapse;" border="1"><tr><th style="padding:6px;">আইডি</th><th>নাম</th><th>মোবাইল</th><th>ঠিকানা</th><th>পয়েন্ট</th></tr>';
            customers.forEach(c => { html += `<tr><td style="padding:6px; font-weight:bold; color:#ff5e00;">${c.id}</td><td style="padding:6px;">${c.name}</td><td style="padding:6px;">${c.phone}</td><td style="padding:6px;">${c.address || ''}</td><td style="padding:6px; color:#28a745; font-weight:bold;">${c.rewardPoints} Pt</td></tr>`; });
            container.innerHTML = html + '</table>';
        }

        function renderManagerOrders() {
            let container = document.getElementById('managerOrderList');
            if(!container) return;
            let appOrders = orders.filter(o => o.adminApproved === true);
            if(appOrders.length === 0) { container.innerHTML = '<p>ম্যানেজার মোডে অনুমোদিত কোনো অর্ডার নেই।</p>'; return; }
            let html = '';
            appOrders.forEach(o => {
                html += `<div class="card" style="border: 1px solid #17a2b8;"><p><b>Invoice No:</b> ${o.invoiceNo || 'N/A'}</p><p><b>গ্রাহক:</b> ${o.customerName} (${o.total}৳)</p><button class="btn btn-info" style="margin-top:8px;" onclick="viewOrder(${o.id})">🔍 ভিউ চেক করুন ও প্রিন্ট করুন</button></div>`;
            });
            container.innerHTML = html;
        }

        function renderAdminOrders() {
            let container = document.getElementById('adminOrderList');
            if(!container) return;
            if(orders.length === 0) { container.innerHTML = '<p>অর্ডার নেই।</p>'; return; }
            let html = '';
            orders.forEach(o => {
                let invDisplay = (o.invoiceNo && o.invoiceNo !== 'undefined') ? o.invoiceNo : 'INV-9102600';
                let isApproved = o.adminApproved === true;
                html += `<div class="card" style="border: 1px solid #ddd;">
                    Invoice No: ${invDisplay} - Customer: ${o.customerName} - Total: ${o.total}৳ <br>
                    ${!isApproved ? `<button class="btn btn-warning" style="margin-top:6px;" onclick="approveOrder(${o.id})">অ্যাডমিন অ্যাপ্রুভ দিন</button>` : '<b style="color:green; display:inline-block; margin-top:6px;">অ্যাডমিন কর্তৃক অনুমোদিত (ম্যানেজার মোডে পাঠানো হয়েছে)</b>'}
                </div>`;
            });
            container.innerHTML = html;
        }

        function approveOrder(id) {
            let o = orders.find(ord => String(ord.id) === String(id));
            if(o) { 
                o.adminApproved = true; 
                if(!o.invoiceNo || o.invoiceNo === 'undefined') {
                    o.invoiceNo = 'INV-' + Math.floor(100000 + Math.random() * 900000);
                }
                localStorage.setItem('disha_orders', JSON.stringify(orders)); 
                renderAdminOrders(); 
                renderManagerOrders();
                alert('অর্ডারটি সফলভাবে অ্যাপ্রুভ করা হয়েছে!'); 
            } else {
                alert('অর্ডারটি খুঁজে পাওয়া যায়নি!');
            }
        }

        function viewOrder(id) {
            let ord = orders.find(o => String(o.id) === String(id));
            if(ord) {
                let itemsHtml = '<ul>';
                ord.items.forEach(i => { itemsHtml += `<li>${i.name} - ৳ ${i.price}</li>`; });
                itemsHtml += '</ul>';
                
                document.getElementById('printInvoiceNo').innerText = `Invoice No: ${ord.invoiceNo || 'INV-9102600'}`;
                document.getElementById('printTimestamp').innerText = `সময়: ${ord.orderTime || ''}`;
                
                document.getElementById('printDetails').innerHTML = `
                    <p style="margin-bottom: 4px;"><b>গ্রাহকের নাম:</b> ${ord.customerName}</p>
                    <p style="margin-bottom: 4px;"><b>মোবাইল নম্বর:</b> ${ord.customerPhone || ''}</p>
                    <p style="margin-bottom: 8px;"><b>ঠিকানা:</b> ${ord.customerAddress || ''}</p>
                    <hr style="margin: 6px 0;">
                    <p style="margin-bottom: 4px;"><b>পণ্যের বিবরণ:</b></p>${itemsHtml}
                    <p style="margin-top: 8px; font-weight: bold; color: #0052D4;">মোট মূল্য: ৳ ${ord.total}</p>
                `;
                
                document.getElementById('viewModal').classList.remove('hidden');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        function closeView() { document.getElementById('viewModal').classList.add('hidden'); }
    </script>
