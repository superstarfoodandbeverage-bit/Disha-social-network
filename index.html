<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অনলাইন বিজনেস অ্যাপ (মাল্টি-রোল)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        header { background: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .mode-switch button { background: white; color: #007bff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .mode-switch button.active { background: #ffc107; color: #000; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        
        /* Customer View */
        .product-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; align-items: center; }
        .product-img { width: 100px; height: 100px; background: #ddd; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #777; font-size: 12px; text-align: center; }
        .product-details h3 { margin-bottom: 5px; color: #222; }
        .product-details p { font-size: 14px; color: #666; margin-bottom: 5px; }
        .price { color: #28a745; font-weight: bold; font-size: 16px; }
        .size-badge { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: 12px; display: inline-block; margin-bottom: 5px; }
        .buy-btn { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px; }

        /* Manager View */
        .admin-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .save-btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h2>স্মার্ট শপ অ্যাপ</h2>
        <div class="mode-switch">
            <button id="custBtn" class="active" onclick="switchMode('customer')">কাস্টমার মোড</button>
            <button id="mgrBtn" onclick="switchMode('manager')">ম্যানেজার মোড</button>
        </div>
    </header>

    <div class="container">
        <!-- কাস্টমার প্যানেল -->
        <div id="customerView">
            <h3>পণ্যসমূহ</h3>
            <hr style="margin: 10px 0 20px 0;">
            <div id="productList">
                <!-- ডায়নামিক প্রোডাক্ট এখানে লোড হবে -->
            </div>
        </div>

        <!-- ম্যানেজার / অ্যাডমিন প্যানেল (যেখানে আপনি তথ্য বসাবেন) -->
        <div id="managerView" class="hidden">
            <div class="admin-panel">
                <h3>নতুন পণ্য যুক্ত করুন (ম্যানেজার মোড)</h3>
                <hr style="margin: 10px 0 15px 0;">
                <div class="form-group">
                    <label>প্রোডাক্টের নাম:</label>
                    <input type="text" id="pName" placeholder="যেমন: প্রিমিয়াম কটন শার্ট">
                </div>
                <div class="form-group">
                    <label>ছবির লিংক (Image URL):</label>
                    <input type="text" id="pImg" placeholder="ছবির ডাইরেক্ট লিংক দিন">
                </div>
                <div class="form-group">
                    <label>রেট / দাম (টাকা):</label>
                    <input type="number" id="pPrice" placeholder="যেমন: ১২০০">
                </div>
                <div class="form-group">
                    <label>সাইজ (Size):</label>
                    <input type="text" id="pSize" placeholder="যেমন: M, L, XL">
                </div>
                <div class="form-group">
                    <label>বিবরণ (Description):</label>
                    <textarea id="pDesc" rows="3" placeholder="পণ্যের সংক্ষিপ্ত বিবরণ লিখুন..."></textarea>
                </div>
                <button class="save-btn" onclick="addProduct()">পণ্য লিস্টে যোগ করুন</button>
            </div>
        </div>
    </div>

    <script>
        // ডিফল্ট কিছু পণ্যের ডেটা
        let products = [
            {
                name: "মেনজ ক্যাজুয়াল শার্ট",
                img: "",
                price: 1250,
                size: "L, XL",
                desc: "১০০% প্রিমিয়াম কটন ফেব্রিক দিয়ে তৈরি আরামদায়ক শার্ট।"
            }
        ];

        function switchMode(mode) {
            if(mode === 'customer') {
                document.getElementById('customerView').classList.remove('hidden');
                document.getElementById('managerView').classList.add('hidden');
                document.getElementById('custBtn').classList.add('active');
                document.getElementById('mgrBtn').classList.remove('active');
                renderProducts();
            } else {
                document.getElementById('customerView').classList.add('hidden');
                document.getElementById('managerView').classList.remove('hidden');
                document.getElementById('mgrBtn').classList.add('active');
                document.getElementById('custBtn').classList.remove('active');
            }
        }

        function addProduct() {
            let name = document.getElementById('pName').value;
            let img = document.getElementById('pImg').value;
            let price = document.getElementById('pPrice').value;
            let size = document.getElementById('pSize').value;
            let desc = document.getElementById('pDesc').value;

            if(!name || !price) {
                alert('অনুগ্রহ করে অন্তত নাম এবং দাম লিখুন!');
                return;
            }

            products.push({ name, img, price, size, desc });
            alert('সফলভাবে পণ্য যুক্ত হয়েছে!');
            
            // ফর্ম ক্লিয়ার করা
            document.getElementById('pName').value = '';
            document.getElementById('pImg').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pSize').value = '';
            document.getElementById('pDesc').value = '';

            switchMode('customer');
        }

        function renderProducts() {
            let listHTML = '';
            products.forEach((p, index) => {
                listHTML += `
                    <div class="product-card">
                        <div class="product-img">
                            ${p.img ? `<img src="${p.img}" style="width:100%; height:100%; object-fit:cover; border-radius:6px;">` : 'ছবি নেই'}
                        </div>
                        <div class="product-details" style="flex: 1;">
                            <h3>${p.name}</h3>
                            <span class="size-badge">সাইজ: ${p.size || 'N/A'}</span>
                            <p>${p.desc || 'কোনো বিবরণ নেই'}</p>
                            <div class="price">৳ ${p.price}</div>
                            <button class="buy-btn" onclick="alert('${p.name} অর্ডার করার জন্য কার্টে যোগ হয়েছে!')">অর্ডার করুন</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('productList').innerHTML = listHTML;
        }

        // প্রথমে পেজ লোড হলে কাস্টমার ভিউ দেখাবে
        renderProducts();
    </script>
</body>
</html>
