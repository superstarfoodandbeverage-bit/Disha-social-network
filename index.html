<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disha Social Network</title>
<style>
html,body{overflow-x:hidden}img{max-width:100%}
:root{
 --blue:#087cf0;--blue2:#064fbe;--green:#16b85a;--text:#10233f;--muted:#728197;
 --bg:#f4f9fd;--card:#fff;--line:#e2eaf2;--shadow:0 5px 18px rgba(20,70,120,.10)
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Bengali",sans-serif;color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg)}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#087cf0,#0754c9);color:#fff;height:70px;padding:8px 12px;display:flex;align-items:center;gap:8px;overflow:hidden}
.sunLogo{font-weight:900;font-size:18px;white-space:nowrap;flex:0 0 auto}.sunLogo span{font-size:25px;vertical-align:middle}
.brand{flex:1;text-align:center;line-height:1.05}.brand b{font-size:19px}.brand small{display:block;font-size:10px}
.dishaLogo{width:42px;height:42px;border-radius:50%;background:#fff;color:#0b63d6;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;border:2px solid #d7edff}.dishaLogoImg{width:44px;height:44px;object-fit:cover;border-radius:50%;background:#fff;flex:0 0 44px}
.screen{padding:13px 12px 82px}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid #edf2f7}
.profile{display:grid;grid-template-columns:1.55fr .8fr .8fr;padding:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:#eaf4ff;display:inline-flex;align-items:center;justify-content:center;font-size:25px;vertical-align:middle;margin-right:8px}.pname{font-weight:800}.sub{font-size:10px;color:var(--muted);margin-top:3px}.metric{text-align:center;border-left:1px solid var(--line);font-size:10px;color:var(--muted)}.metric b{display:block;color:var(--text);font-size:17px;margin-top:2px}
.hero{margin-top:11px;border-radius:15px;padding:17px;color:#fff;background:linear-gradient(120deg,#084fa9,#13a8e7);position:relative;overflow:hidden}.hero b{display:block;color:#ffdf3f;font-size:22px;margin-top:3px}.hero small{font-size:11px}.hero:after{content:"Disha";position:absolute;right:-5px;bottom:-14px;font-size:55px;font-weight:900;color:#ffffff22}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}.q{border:0;border-radius:13px;padding:11px 3px;background:#fff;box-shadow:var(--shadow);font-weight:700;font-size:12px}.q i{font-style:normal;font-size:23px;display:block;margin-bottom:4px}.q:nth-child(1){background:#ff8a19;color:#fff}.q:nth-child(2){background:#7b46e8;color:#fff}.q:nth-child(3){background:#13ae66;color:#fff}.q:nth-child(4){background:#ff9f20;color:#fff}
.quick2 .q:nth-child(1){background:#ed3d7b}.quick2 .q:nth-child(2){background:#216ce5}.quick2 .q:nth-child(3){background:#e23c48}.quick2 .q:nth-child(4){background:#12a59d}
.balance{margin-top:12px;padding:14px;background:linear-gradient(135deg,#087bea,#0a60d0);color:#fff}.balance b{font-size:24px}.balance button{border:0;background:#fff;color:#075fd0;border-radius:18px;padding:8px 13px;font-weight:800;margin-top:8px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}.sectionTitle h3{margin:0;font-size:16px}.link{border:0;background:none;color:#0874e6;font-size:12px}
.product{display:flex;gap:10px;padding:10px;border-radius:13px;background:#fff;box-shadow:var(--shadow);margin:8px 0}.prodImg{width:70px;height:70px;border-radius:11px;background:#eef7ff;display:flex;align-items:center;justify-content:center;font-size:30px}.product h4{margin:2px 0 4px;font-size:14px}.price{font-weight:900;color:#101d2f}.old{text-decoration:line-through;color:#9ba7b5;font-size:11px;margin-left:5px}.prodBtns{margin-top:6px}.outline,.green{border-radius:16px;padding:7px 10px;font-size:11px;font-weight:800}.outline{border:1px solid #c8def4;background:#fff;color:#0871dc}.green{border:0;background:var(--green);color:#fff}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:67px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:30}.bottom button{border:0;background:#fff;color:#52677e;font-size:18px}.bottom small{display:block;font-size:9px;margin-top:2px}.bottom .active{color:#0877e8;font-weight:900}
.pageHead{height:52px;margin:-13px -12px 12px;padding:0 14px;background:linear-gradient(110deg,#087cf0,#0754c9);color:#fff;display:flex;align-items:center;gap:10px}.back{border:0;background:none;color:#fff;font-size:25px}.pageHead b{font-size:17px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap;border:1px solid #dbe7f1;background:#fff;border-radius:16px;padding:7px 13px;font-size:11px}.tabs .on{background:#087cf0;color:#fff;border-color:#087cf0}
.detailImg{height:210px;border-radius:14px;background:#eef7ff;display:flex;align-items:center;justify-content:center;font-size:85px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #d6e2ed;background:#fff}.full{width:100%;height:45px;border:0;border-radius:23px;background:#0aa85a;color:#fff;font-weight:900;margin-top:12px}
.cartRow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cartRow:last-child{border:0}.cartIcon{width:58px;height:58px;background:#eef7ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px}
.form input,.form textarea{width:100%;border:1px solid #d7e2ec;border-radius:10px;padding:12px;margin:5px 0}.form textarea{min-height:90px;resize:vertical}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px;background:#fff;border-radius:13px;box-shadow:var(--shadow)}.stat b{display:block;font-size:22px;margin-top:5px}.stat small{color:var(--muted);font-size:10px}
.list{background:#fff;border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.listRow{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.listRow:last-child{border:0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}.login .card{padding:24px;width:100%;max-width:390px;text-align:center}.loginLogo{font-size:35px;font-weight:900;color:#0a62d1}.loginD{font-size:24px;color:#0a62d1;font-weight:900}.login input{width:100%;height:48px;border:1px solid #d5e1ec;border-radius:10px;padding:0 12px;margin:6px 0}.login .full{background:#087cf0;margin-top:8px}.adminBtn{width:100%;height:43px;border:1px solid #cfe0ef;border-radius:22px;background:#fff;color:#075fcf;font-weight:800;margin-top:9px}
.hidden{display:none!important}
</style>

async function loadAdminProducts(){
 const el=document.getElementById('productList'); if(!el)return;
 try{
   const s=await db.collection('products').get();
   const docs=s.docs.slice().sort((a,b)=>{const ta=a.data().createdAt?.toMillis?.()||0,tb=b.data().createdAt?.toMillis?.()||0;return tb-ta;});
   el.innerHTML=!docs.length?'<div class="listRow">No products yet.</div>':docs.map(d=>{const p=d.data();const image=p.img?`<img src="${p.img}" style="width:54px;height:54px;object-fit:cover;border-radius:10px;margin-right:10px">`:'';return `<div class="listRow" style="display:flex;align-items:center;gap:6px"><span style="display:flex;align-items:center;flex:1">${image}<span><b>${p.name||''}</b><small style="display:block;color:#718197">${p.cat||'Other'} · ৳ ${p.price||0} · ${p.unit||'pcs'}</small></span></span><button class="outline" onclick="editProductFirebase('${d.id}')">Edit</button></div>`}).join('');
 }catch(e){el.innerHTML='<div class="listRow">Products load করা যায়নি: '+(e.message||'Unknown error')+'</div>';console.error(e)}
}
function previewProductImage(event){
 const file=event.target.files?.[0]; const preview=document.getElementById('pimgPreview');
 if(!file){preview.style.display='none';preview.removeAttribute('src');return;}
 const reader=new FileReader(); reader.onload=()=>{preview.src=reader.result;preview.style.display='block'}; reader.readAsDataURL(file);
}
function getCompressedProductImage(file){
 return new Promise((resolve,reject)=>{
   if(!file){resolve('');return;}
   const reader=new FileReader();
   reader.onerror=reject;
   reader.onload=()=>{
     const img=new Image(); img.onload=()=>{
       const max=700, scale=Math.min(1,max/Math.max(img.width,img.height));
       const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
       const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
       resolve(c.toDataURL('image/jpeg',0.72));
     }; img.onerror=reject; img.src=reader.result;
   }; reader.readAsDataURL(file);
 });
}

function normalizePhone(v){
  let x=(v||'').replace(/[^0-9+]/g,'');
  if(x.startsWith('01')) x='+880'+x.slice(1);
  if(x.startsWith('8801')) x='+'+x;
  return x;
}

  if(!confirmationResult||!/^\d{6}$/.test(code)){msg('৬ সংখ্যার OTP দিন।');return}
  try{
    const result=await confirmationResult.confirm(code);
    const u=result.user;
    const ref=db.collection('users').doc(u.uid);
    const snap=await ref.get();
    if(!snap.exists){
      const name=document.getElementById('nm').value.trim()||'Member';
      const affiliateId='DSN'+String(Math.floor(100000+Math.random()*900000));
      await ref.set({name,phone:u.phoneNumber||'',role:'customer',affiliateId,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    } else if(document.getElementById('nm').value.trim()){
      await ref.set({name:document.getElementById('nm').value.trim()}, {merge:true});
    }
    await enterCustomer(u.uid);
  }catch(e){console.error(e);msg('OTP ভুল বা মেয়াদ শেষ হয়েছে।');}

    currentRole=role;document.getElementById('login').classList.add('hidden');document.getElementById('main').classList.remove('hidden');document.getElementById('nav').classList.add('hidden');
    role==='admin'?adminDashboard():managerDashboard();
  }catch(e){console.error(e);msg('Email অথবা Password সঠিক নয়।');}
}

async function addProductAdmin(){
 const n=document.getElementById('pn')?.value.trim();
 const c=document.getElementById('pc')?.value.trim()||'Other';
 const pr=Number(document.getElementById('pp')?.value);
 const old=Number(document.getElementById('po')?.value)||pr;
 const u=document.getElementById('pu')?.value.trim()||'pcs';
 const d=document.getElementById('pd')?.value.trim()||'Quality product.';
 const file=document.getElementById('pimg')?.files?.[0]||null;
 if(!n||!pr){alert('Product Name এবং Selling Price দিন।');return}
 try{
   const img=await getCompressedProductImage(file);
   if(img.length>700000){alert('ছবিটি অনেক বড়। ছোট সাইজের ছবি দিন।');return;}
   await db.collection('products').add({name:n,cat:c,price:pr,old:old,unit:u,icon:'📦',img:img,desc:d,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   alert('Product সফলভাবে Firebase-এ Save হয়েছে।');
   productAdmin();
 }catch(e){console.error(e);alert('Product Save হয়নি: '+(e.message||e));}
}

async function editProductFirebase(id){
  try{
    const ref=db.collection('products').doc(id), snap=await ref.get(); if(!snap.exists)return;
    const p=snap.data();
    const n=prompt('Product Name',p.name||''); if(n===null)return;
    const pr=prompt('Selling Price',p.price||0); if(pr===null)return;
    const u=prompt('Size / Unit',p.unit||'pcs'); if(u===null)return;
    await ref.update({name:n.trim()||p.name,price:Number(pr)||p.price,unit:u.trim()||p.unit});
    alert('Product updated.'); productAdmin();
  }catch(e){alert('Product update হয়নি: '+(e.message||e));}
}
