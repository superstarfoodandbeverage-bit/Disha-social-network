<style>
:root{--navy:#2f72b8;--blue:#78b9f2;--cyan:#edf7ff;--gold:#e7b84f;--ink:#26384d;--muted:#65778d;--bg:#f5faff;--card:#fff;--line:#dceaf7;--green:#14845b;--red:#c23b4a;--shadow:0 8px 24px #2c659015}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}button.secondary{background:#eaf1fb;color:var(--navy)}button.danger{background:#fff0f1;color:var(--red)}button.good{background:#e8f7ef;color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1200px;margin:auto;min-height:100vh}.top{background:linear-gradient(120deg,var(--header,#eaf6ff),var(--blue,#78b9f2) 72%,var(--gold,#f8e8bd));color:#183c63;padding:30px 20px 22px;border-radius:0 0 24px 24px}.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;flex:1;padding-top:16px}.brand>div:last-child{width:100%}.logo{width:56px;height:56px;border-radius:17px;background:#fff;color:#1456a8;display:grid;place-items:center;font-size:23px;font-weight:950;box-shadow:0 5px 15px #0002;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font-size:22px;margin:0;color:var(--brand-text,#183c63)}.brand p{margin:0;color:var(--tagline-color,#f5bd35);font-size:20px;font-weight:850;letter-spacing:.3px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.topline select{background:#fff;color:var(--navy);border:0;border-radius:10px;padding:9px}.slogan{text-align:center;margin:12px 0 0;font-weight:700;letter-spacing:.2px}.workspace{display:grid;grid-template-columns:238px minmax(0,1fr);gap:0;align-items:start}.sidebar{background:#075e5a;color:#fff;min-height:calc(100vh - 170px);padding:16px 11px;position:sticky;top:0;border-radius:0 0 14px 0}.side-title{font-weight:850;font-size:14px;letter-spacing:.5px;padding:10px 12px 15px;border-bottom:1px solid #ffffff30;margin-bottom:10px}.nav{display:flex;flex-direction:column;gap:5px;overflow:visible;padding:0;background:transparent;position:static;box-shadow:none}.nav button{display:flex;align-items:center;gap:11px;text-align:left;width:100%;white-space:normal;background:transparent;color:#e8fffb;font-size:14px;padding:11px 12px;border-radius:9px}.nav button.active{background:#b8eee2;color:#064d49;font-weight:800}.main{padding:18px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 15px;flex-wrap:wrap}.pagehead h2{margin:0;font-size:22px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.stat{font-size:25px;font-weight:850;color:var(--navy);margin-top:5px}.tile{display:flex;align-items:center;gap:13px;text-align:left;background:white;color:var(--ink);border:1px solid var(--line);padding:16px;box-shadow:var(--shadow);width:100%}.tile .ico{font-size:25px;background:var(--cyan);width:45px;height:45px;border-radius:13px;display:grid;place-items:center}.tile b{display:block}.tile small{color:var(--muted);font-weight:400}.section{margin:18px 0}.section h3{margin:0 0 10px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:13px;color:#52617a;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d5dfed;border-radius:11px;background:#fff;color:var(--ink)}.field textarea{min-height:75px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#eaf2ff;color:#1854a0;font-size:11px;font-weight:750}.pill.green{background:#e7f7ef;color:#14724f}.pill.orange{background:#fff4dc;color:#926100}.pill.red{background:#fff0f1;color:#b52e40}.product{overflow:hidden;padding:0}.product .photo{height:125px;background:linear-gradient(135deg,#e5f1ff,#f9fbff);display:grid;place-items:center;font-size:48px;color:#1769d2}.product .pbody{padding:13px}.price{font-weight:850;color:#123b7a}.old{text-decoration:line-through;color:#8994a7;font-size:12px;margin-left:5px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}th{background:linear-gradient(90deg,#e8f4ff,#fff3d6);color:#355675}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:30px}.notice{padding:12px 14px;background:#fff8e8;border:1px solid #f2dfad;border-radius:12px;color:#775414;font-size:13px;margin:12px 0}.hidden{display:none!important}.footer{text-align:center;color:#8994a7;padding:25px;font-size:12px}.modal{position:fixed;inset:0;background:#07152c88;display:grid;place-items:center;padding:15px;z-index:10}.modalbox{background:white;border-radius:18px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.modalbox h3{margin-top:0}.rank{border-left:4px solid var(--gold)}.slogan{color:var(--tagline-color,#f5bd35)}.stat{color:#3976b9}.logo{border:0}.hero{background:linear-gradient(110deg,#e7f4ff,#c5e3fb 75%,#fff0ca);color:#244d78;border:1px solid #d5e8f8;border-radius:18px;padding:20px;margin-bottom:14px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#476987}.small{font-size:12px}.memo{position:relative;background:white;border:1px solid #dce6f1;padding:16px;color:#26384d}.memohead{display:flex;justify-content:space-between;gap:12px}.memohead>b{font-size:22px;color:#3976b9}.memocust{text-align:right;font-size:12px;line-height:1.6}.watermark{position:absolute;top:40%;left:35%;font-size:76px;font-weight:900;color:#3976b9;opacity:.07;pointer-events:none}.memo table{width:100%;border-collapse:collapse;margin-top:18px;min-width:0}.memo th,.memo td{border:1px solid #dce6f1;padding:8px;font-size:12px}.memo th{background:#eff7ff}.right{text-align:right}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.sidebar{position:static;min-height:0;border-radius:0;padding:8px 10px}.side-title{padding:6px 8px 8px;margin-bottom:6px}.nav{display:grid;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:4px}.nav button{width:auto;min-width:130px;padding:9px 11px;font-size:12px}.main{padding:13px}}

<body><div class="app">
<header class="top"><div class="topline"><div class="brand"><div class="logo" id="brandLogo">SUN</div><p>Digital Business Platform</p></div><div class="row"><select id="roleSelect" aria-label="Demo role"><option value="customer">Customer Mode</option><option value="manager">Manager Mode</option><option value="admin">Admin Mode</option></select><button class="secondary" id="resetDemo" title="ডেমো ডেটা রিসেট">Reset</button></div></div></header>
<div class="workspace"><aside class="sidebar"><div class="side-title" id="sideTitle">CUSTOMER MENU</div><nav class="nav" id="nav"></nav></aside><main class="main" id="view"></main></div><div class="footer">SUN-My Business • Version 2.0.0 • Local Demo • Firebase/Server Security এখনো সংযুক্ত নয়</div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='sun_my_business_demo_v1';
const defaults={
 version:'2.0.0',releaseNotes:'Manager sidebar navigation, pending order list, and separate customer/super-dealer/dealer order filters',pointsPer100:1,sharePoints:5,rankRules:[{name:'Silver',points:100},{name:'Gold',points:300},{name:'Platinum',points:1000},{name:'Diamond',points:2000},{name:'Crown',points:3250},{name:'Star Crown',points:4500}],
 products:[],orders:[],customers:[{id:'SUN1001',name:'Demo Customer',phone:'01XXXXXXXXX',points:0}],dealers:[{id:'DL1001',name:'Demo Dealer',phone:'01XXXXXXXXX'}],logs:[],media:[{name:'Sun Product Facebook Page',url:'https://www.facebook.com/share/1JvW7rGx3R/'},{name:'YouTube Channel',url:'https://youtube.com/'},{name:'SUN জীবনের গল্প',url:''},{name:'Zoom Live Meeting',url:''}],teamSales:[],updates:[],photos:{},cart:[],shareClaims:[],winners:[],auth:{},settings:{businessName:'Sun Super Mart',currency:'৳',bgColor:'#ffffff',headerColor:'#123db5',primaryColor:'#1746a2',darkColor:'#092b86',accentColor:'#f5bd35',whiteBackground:true,logoSize:56,brandTextColor:'#183c63',taglineColor:'#f5bd35',taglineSize:18}
};
let db=load(),role='customer',page='home',category='All',orderFilter='all';
if(db.version==='1.5.0'){const demoNames=['SUN Power White Detergent 500g','SUNMARK Mustard Oil 500ml','VITA-C Orange','Special Curry Masala','Honey 250g','Reselling Demo Product'];db.products=(db.products||[]).filter(p=>!demoNames.includes(p.name));}if(db.pointsPer100===undefined)db.pointsPer100=1;if(!db.winners)db.winners=[];if(!db.photos)db.photos={};if(!db.settings)db.settings={businessName:'Sun Super Mart',currency:'৳'};if(!db.settings.logoSize)db.settings.logoSize=56;if(!db.auth)db.auth={};if(!Array.isArray(db.updates))db.updates=[];if(!Array.isArray(db.orders))db.orders=[];if(!Array.isArray(db.customers))db.customers=[];if(!Array.isArray(db.products))db.products=[];if(!Array.isArray(db.logs))db.logs=[];if(!Array.isArray(db.rankRules))db.rankRules=structuredClone(defaults.rankRules);if(!Array.isArray(db.cart))db.cart=[];save();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
// Migration: preserve existing local demo data and append the supplied Facebook page only if missing.
if(!Array.isArray(db.media)) db.media=[];
if(!db.media.some(m=>m.url==='https://www.facebook.com/share/1JvW7rGx3R/')) db.media.unshift({name:'Sun Product Facebook Page',url:'https://www.facebook.com/share/1JvW7rGx3R/'});
if(!db.version || ['1.1.0','1.1.1'].includes(db.version)) db.version='1.2.0';
if(db.version==='1.3.0'){db.updates.unshift({version:'1.4.0',notes:'Custom app colors; improved product photo compression; customer profile login and home dashboard',date:new Date().toLocaleDateString('bn-BD')});db.version='1.4.0';db.releaseNotes='Custom app colors; improved photo upload; customer name, ID, points and rank on home after login';}
if(!db.updates.some(u=>u.version==='1.2.0')) db.updates.unshift({version:'1.2.0',notes:'Light blue + gold theme; fixed checkout address/COD fields and dealer memo details',date:new Date().toLocaleDateString('bn-BD')});
if(!db.settings)db.settings={};if(!db.settings.brandTextColor)db.settings.brandTextColor='#183c63';if(!db.settings.taglineColor)db.settings.taglineColor='#f5bd35';if(!db.settings.taglineSize)db.settings.taglineSize=18;if(!Array.isArray(db.orders))db.orders=[];db.orders.forEach(o=>{if(!o.courierStatus)o.courierStatus='Not Booked';if(o.codAmount===undefined)o.codAmount=Math.max(0,Number(o.total||0)-Number(o.advance||0));if(!o.payment)o.payment='Cash on Delivery'});db.version='2.0.0';db.releaseNotes='Manager sidebar and separate order lists: centered lowered SUN logo with Digital Business Platform only; customer, manager, admin, products, COD and courier features retained';save();

function applyBranding(){let box=document.getElementById('brandLogo');let st=db.settings||{};if(box){box.innerHTML=st.logo?`<img src="${st.logo}" alt="SUN Logo">`:'SUN';let n=Number(st.logoSize)||56;box.style.width=n+'px';box.style.height=n+'px';box.style.margin='0 auto';}let root=document.documentElement;root.style.setProperty('--bg',st.whiteBackground===false?(st.bgColor||'#f5faff'):'#ffffff');root.style.setProperty('--blue',st.primaryColor||'#1746a2');root.style.setProperty('--navy',st.darkColor||'#092b86');root.style.setProperty('--gold',st.accentColor||'#f5bd35');root.style.setProperty('--header',st.headerColor||'#123db5');root.style.setProperty('--brand-text',st.brandTextColor||'#183c63');root.style.setProperty('--tagline-color',st.taglineColor||'#f5bd35');let bp=document.querySelector('.brand p');if(bp){bp.textContent='Digital Business Platform';bp.style.fontSize=(Number(st.taglineSize)||18)+'px';}let bh=document.querySelector('.brand h1');if(bh)bh.style.color=st.brandTextColor||'#183c63';let reset=document.getElementById('resetDemo');if(reset)reset.style.display=role==='admin'?'':'none'}

function setWhiteBackground(on){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');db.settings.whiteBackground=!!on;save();applyBranding();log('Background Updated',on?'White':'Soft Blue');render()}
function saveColors(){if(role!=='admin')return alert('শুধু Admin কালার পরিবর্তন করতে পারবেন');let st=db.settings;st.bgColor=document.getElementById('cBg').value;st.headerColor=document.getElementById('cHeader').value;st.primaryColor=document.getElementById('cPrimary').value;st.darkColor=document.getElementById('cDark').value;st.accentColor=document.getElementById('cAccent').value;st.brandTextColor=document.getElementById('cBrandText').value;st.taglineColor=document.getElementById('cTagline').value;st.taglineSize=Number(document.getElementById('cTaglineSize').value)||18;try{save();log('App Colors Updated');applyBranding();render();alert('অ্যাপের কালার ও লেখার রং সংরক্ষণ হয়েছে')}catch(e){alert('সেটিংস সংরক্ষণ করা যায়নি। ফোনের ব্রাউজার স্টোরেজ পরীক্ষা করুন।')}}
function setLogoSize(v){if(role!=='admin')return;let n=Number(v);if(![50,56,64,72,80].includes(n))return;db.settings.logoSize=n;save();applyBranding();log('Logo Size Updated',n+'px');render()}
function saveLogo(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let f=document.getElementById('logoFile')?.files?.[0];if(!f)return alert('প্রথমে লোগো ছবি নির্বাচন করুন');if(!f.type.startsWith('image/'))return alert('ছবি ফাইল নির্বাচন করুন');if(f.size>50*1024*1024)return alert('ছবির সাইজ ৫০ MB-এর কম রাখুন');compressImage(f,320,.68,32000,data=>{try{db.settings.logo=data;save();log('SUN Logo Updated');render();alert('SUN লোগো সংরক্ষণ হয়েছে')}catch(e){alert('লোগো সংরক্ষণ করা যায়নি। পুরোনো ছবি/ডেটা ব্যাকআপ নিয়ে স্টোরেজ খালি করুন।')}},()=>alert('লোগো ছবি পড়া যায়নি। JPG বা PNG ছবি দিয়ে আবার চেষ্টা করুন।'))}
function saveBanner(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let f=document.getElementById('bannerFile')?.files?.[0];if(!f)return alert('ব্যানার ছবি নির্বাচন করুন');if(!f.type.startsWith('image/'))return alert('ছবি নির্বাচন করুন');if(f.size>50*1024*1024)return alert('ছবির সাইজ ৫০ MB-এর কম রাখুন');compressImage(f,900,.58,65000,data=>{try{db.settings.banner=data;save();log('Home Banner Updated');render();alert('ব্যানার সংরক্ষণ হয়েছে')}catch(e){alert('ব্যানার সংরক্ষণ করা যায়নি। ছবির সাইজ কমিয়ে আবার চেষ্টা করুন।')}},()=>alert('ব্যানার ছবি পড়া যায়নি। JPG বা PNG ছবি দিয়ে আবার চেষ্টা করুন।'))}
function removeBanner(){if(role!=='admin')return;delete db.settings.banner;save();log('Home Banner Removed');render()}
function removeLogo(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');if(!confirm('ডিফল্ট SUN লেখা ফিরিয়ে আনবেন?'))return;delete db.settings.logo;save();log('SUN Logo Reset');render()}

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function log(action,detail=''){db.logs.unshift({time:new Date().toLocaleString('bn-BD'),role,action,detail});db.logs=db.logs.slice(0,250);save()}
function money(n){return '৳'+Number(n||0).toLocaleString('en-US')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function price(p){let v=Number(p.price);if(p.discountType==='percent')v-=v*Number(p.discount)/100;if(p.discountType==='fixed')v-=Number(p.discount);return Math.max(0,Math.round(v*100)/100)}
function navItems(){let base=[['home','🏠','হোম'],['products','🛍️','SUN Products'],['other','🧺','Other Products'],['resell','📦','Reselling Board'],['affiliate','🔗','Affiliate'],['cart','🛒','Cart'],['orders','🧾','Orders'],['points','🏆','My Points'],['media','🎬','Media']];if(role==='manager')base=[['home','▣','Dashboard'],['orders','🧾','সব অর্ডার'],['manager-pending','🟠','Pending Orders'],['manager-customer','👤','Customer Orders'],['manager-superdealer','🏢','Super Dealer Orders'],['manager-dealer','🚚','Dealer Orders'],['dealers','👥','Dealer List'],['products','📦','Product List'],['reports','📊','Reports'],['print','🖨️','Print Preview'],['winners','🏆','Winners']];if(role==='admin')base=[['home','🏠','Dashboard'],['products','🛍️','Products'],['other','🧺','Other Products'],['orders','🧾','সব অর্ডার'],['manager-pending','🟠','Pending Orders'],['manager-customer','👤','Customer Orders'],['manager-superdealer','🏢','Super Dealer Orders'],['manager-dealer','🚚','Dealer Orders'],['customers','👥','Customers'],['dealers','🚚','Dealers'],['points','🏆','Points & Ranks'],['team','🤝','Team Income'],['media','🎬','Media & Live'],['reports','📊','Reports'],['admin','⚙️','Admin Control'],['courier','🚚','Courier Booking & Tracking'],['updates','🔄','Smart Update'],['winners','🏆','Winners'],['audit','📋','Audit Log']];return base}
function render(){applyBranding();document.getElementById('roleSelect').value=role;let st=document.getElementById('sideTitle');if(st)st.textContent=role==='manager'?'MANAGER MODE':role==='admin'?'ADMIN PANEL':'CUSTOMER MENU';document.getElementById('nav').innerHTML=navItems().map(([id,ic,n],i)=>{let active=page===id||(id==='manager-pending'&&page==='orders'&&orderFilter==='pending')||(id==='manager-customer'&&page==='orders'&&orderFilter==='customer')||(id==='manager-superdealer'&&page==='orders'&&orderFilter==='superdealer')||(id==='manager-dealer'&&page==='orders'&&orderFilter==='dealer');return `<button class="${active?'active':''}" onclick="go('${id}')"><span>${ic}</span><span>${String(i+1).padStart(2,'0')} · ${n}</span></button>`}).join('');let f=({home,products,other,resell,affiliate,cart,orders,points,media,bulk,dealers,reports,print,customers,team,admin,courier,updates,winners,audit})[page]||home;document.getElementById('view').innerHTML=f()}
function go(p){let subs=['manager-pending','manager-customer','manager-superdealer','manager-dealer'];let allowed=role==='admin'?['home','products','other','resell','affiliate','cart','orders','points','media','bulk','dealers','reports','print','customers','team','admin','courier','updates','winners','audit',...subs]:role==='manager'?['home','products','orders','dealers','reports','print','winners',...subs]:['home','products','other','resell','affiliate','cart','orders','points','media'];if(!allowed.includes(p)){alert('এই অপশনটি আপনার মুডে অনুমোদিত নয়');return}if(p==='manager-pending'){orderFilter='pending';page='orders'}else if(p==='manager-customer'){orderFilter='customer';page='orders'}else if(p==='manager-superdealer'){orderFilter='superdealer';page='orders'}else if(p==='manager-dealer'){orderFilter='dealer';page='orders'}else{if(p==='orders')orderFilter='all';page=p}render()}

function home(){let me=currentCustomer(),pts=Number(me?.points||0),rank=[...db.rankRules].sort((a,b)=>a.points-b.points).filter(r=>pts>=r.points).at(-1)?.name||'Member';if(role==='customer'){let profile=me?`<div class="card section"><div class="between"><h3>আপনার অ্যাকাউন্ট</h3><button class="secondary" onclick="customerLogout()">Logout</button></div><div class="grid"><div><div class="muted">নাম</div><b>${esc(me.name)}</b></div><div><div class="muted">Customer ID</div><b>${esc(me.id)}</b></div><div><div class="muted">মোবাইল নম্বর</div><b>${esc(me.phone)}</b></div><div><div class="muted">পয়েন্ট</div><div class="stat">${pts.toLocaleString('en-US')}</div></div><div><div class="muted">সদস্য পদবি</div><b>${esc(rank)}</b></div></div></div>`:`<div class="card section"><h3>কাস্টমার লগইন</h3><p class="muted">লগইন করলে আপনার নাম, Customer ID, মোবাইল নম্বর ও পয়েন্ট এখানে দেখা যাবে।</p><button onclick="customerLogin()">Customer Login</button></div>`;let quick=[['products','🛒','Shop'],['points','🎁','Rewards'],['points','⭐','My Points'],['media','🎧','Support']];let featured=db.products.filter(p=>p.category==='SUN Products'&&p.active).slice(0,4);return `${profile}${db.settings.banner?`<img src="${db.settings.banner}" alt="SUN Banner" style="width:100%;max-height:250px;object-fit:cover;border-radius:18px;margin:10px 0">`:`<div class="hero"><h2>সান লাইফ বেটার লাইফ</h2><p>এক সাথে এগিয়ে চলি সফলতার পথে</p></div>`}<div class="grid">${quick.map(([id,ic,n])=>`<button class="tile" onclick="go('${id}')"><span class="ico">${ic}</span><span><b>${n}</b></span></button>`).join('')}</div><div class="pagehead section"><h2>Our Products</h2><button class="secondary" onclick="go('products')">See All →</button></div><div class="grid">${featured.map(productCard).join('')||'<div class="empty card">Admin এখনো পণ্য যোগ করেননি</div>'}</div><div class="notice">অর্ডার অনুমোদিত হলে কেনাকাটার পয়েন্ট আপনার অ্যাকাউন্টে যোগ হবে।</div>`}let total=db.orders.filter(o=>o.status==='Approved').reduce((s,o)=>s+o.total,0),pending=db.orders.filter(o=>o.status==='Pending').length;if(role==='manager')return `<div class="hero"><h2>Manager Dashboard</h2><p>শুধু অনুমোদিত অর্ডার দেখুন এবং মেমো প্রিন্ট করুন।</p></div><div class="grid"><div class="card"><div class="muted">অনুমোদিত অর্ডার</div><div class="stat">${db.orders.filter(o=>o.status==='Approved').length}</div></div><div class="card"><div class="muted">অনুমোদিত বিক্রয়</div><div class="stat">${money(total)}</div></div></div><div class="grid section"><button class="tile" onclick="go('orders')">🧾 Approved Orders</button><button class="tile" onclick="go('reports')">📊 Reports</button><button class="tile" onclick="go('print')">🖨️ Print Preview</button></div>`;return `<div class="hero"><h2>Admin Dashboard</h2><p>পণ্য, অর্ডার, কাস্টমার ও অ্যাপের সব নিয়ন্ত্রণ।</p></div><div class="grid"><div class="card"><div class="muted">মোট পণ্য</div><div class="stat">${db.products.length}</div></div><div class="card"><div class="muted">মোট অর্ডার</div><div class="stat">${db.orders.length}</div></div><div class="card"><div class="muted">অপেক্ষমাণ অর্ডার</div><div class="stat">${pending}</div></div><div class="card"><div class="muted">অনুমোদিত বিক্রয়</div><div class="stat">${money(total)}</div></div></div><div class="section card"><div class="between"><h3>অর্ডার Approval</h3><span class="pill orange">Pending: ${pending}</span></div>${pending?db.orders.filter(o=>o.status==='Pending').map(o=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(o.id)} • ${esc(o.name)}</b><div class="muted small">${esc(o.phone)} • ${money(o.total)}</div></div><div class="row"><button class="good" onclick="approve('${o.id}')">Approve</button><button class="danger" onclick="reject('${o.id}')">Reject</button></div></div>`).join(''):'<p class="muted">এখনো কোনো Pending অর্ডার নেই।</p>'}</div><div class="grid section">${navItems().filter(x=>x[0]!=='home').map(([id,ic,n])=>`<button class="tile" onclick="go('${id}')"><span class="ico">${ic}</span><span><b>${n}</b></span></button>`).join('')}</div>`}

function productCard(p){let img=db.photos?.[p.id]?`<img src="${db.photos[p.id]}" alt="${esc(p.name)}" style="width:100%;height:125px;object-fit:contain;background:#fff">`:`<div class="photo" style="height:125px;background:#f7f9fc;color:#aab5c4;font-size:13px">ছবি আপলোড হয়নি</div>`;return `<div class="card product">${img}<div class="pbody"><b>${esc(p.name)}</b><div class="muted small">${esc(p.weight||'সাইজ / ওজন উল্লেখ নেই')}</div><div style="margin:8px 0"><span class="price">${money(price(p))}</span></div>${role==='customer'?'<button style="width:100%;margin-top:9px" '+((!p.active||p.stock<=0)?'disabled':'')+' onclick="addCart('+p.id+')">🛒 কার্টে যোগ করুন</button>':''}</div></div>`}
function products(){let list=db.products.filter(p=>p.category==='SUN Products'&&p.active);return `<div class="pagehead"><h2>SUN Products</h2>${role==='admin'?'<button onclick="productForm()">+ পণ্য যোগ</button>':''}</div><div class="row section"><button class="secondary" onclick="category='All';render()">সব পণ্য</button><button class="secondary" onclick="category='SUN Products';render()">SUN Products</button></div><div class="grid">${list.map(productCard).join('')||'<div class="empty">এখনো পণ্য নেই</div>'}</div>`}
function other(){let list=db.products.filter(p=>p.category==='Other Products'&&p.active);return `<div class="pagehead"><h2>Other Products</h2>${role==='admin'?'<button onclick="productForm()">+ পণ্য যোগ</button>':''}</div><p class="muted">SUN ব্র্যান্ডের বাইরের পণ্য বিক্রির জন্য আলাদা বিভাগ।</p><div class="grid">${list.map(productCard).join('')||'<div class="empty">এখনো পণ্য নেই</div>'}</div>`}
function affiliate(){let id=db.customers[0]?.id||'SUN1001';return `<div class="pagehead"><h2>Affiliate & Referral</h2></div><div class="card"><div class="muted">আপনার Demo Affiliate ID</div><div class="stat">${esc(id)}</div><p class="muted">এই ডেমোতে রেফারেল আইডি দেখানো হচ্ছে। প্রকৃত রেফারেল ট্র্যাকিং, কমিশন ও সদস্য-সংযোগ Firebase যুক্ত করার পর নিরাপদভাবে চালু হবে।</p><button onclick="navigator.clipboard?.writeText('${esc(id)}').then(()=>alert('ID কপি হয়েছে')).catch(()=>alert('কপি করা যায়নি'))">ID Copy</button></div><div class="card section"><h3>Affiliate Rules</h3><p>কমিশন শুধুমাত্র Admin-যাচাইকৃত প্রকৃত পণ্য বিক্রির ভিত্তিতে গণনা হবে।</p></div>`}
function resell(){let list=db.products.filter(p=>p.category==='SUN Reselling'&&p.active);return `<div class="pagehead"><h2>SUN Reselling Board</h2>${role==='admin'?'<button onclick="productForm()">+ রিসেলিং পণ্য</button>':''}</div><p class="muted">রিসেলাররা পণ্য বেছে নিয়ে নিজের গ্রাহকের অর্ডার তৈরি করতে পারবেন।</p><div class="grid">${list.map(productCard).join('')||'<div class="empty">রিসেলিং পণ্য যোগ করা হয়নি</div>'}</div>`}
function addCart(id){if(role==='manager')return alert('Manager Mode-এ অর্ডার করা যাবে না');let p=db.products.find(x=>x.id===id);if(!p||!p.active||p.stock<1)return;let c=db.cart.find(x=>x.id===id);if(c)c.qty++;else db.cart.push({id,qty:1});save();alert('কার্টে যোগ হয়েছে');}
function cart(){let rows=db.cart.map(c=>{let p=db.products.find(x=>x.id===c.id);return p?`<tr><td>${esc(p.name)}</td><td>${money(price(p))}</td><td><input type="number" min="1" max="${p.stock}" value="${c.qty}" style="width:65px" onchange="qtyCart(${p.id},this.value)"></td><td>${money(price(p)*c.qty)}</td><td><button class="danger" onclick="removeCart(${p.id})">বাদ</button></td></tr>`:''}).join('');let total=db.cart.reduce((s,c)=>{let p=db.products.find(x=>x.id===c.id);return s+(p?price(p)*c.qty:0)},0);return `<div class="pagehead"><h2>Shopping Cart</h2></div><div class="tablewrap"><table><tr><th>পণ্য</th><th>দাম</th><th>পরিমাণ</th><th>মোট</th><th></th></tr>${rows||'<tr><td colspan="5" class="empty">কার্ট খালি</td></tr>'}</table></div><div class="card section"><div class="between"><b>সর্বমোট</b><div class="stat">${money(total)}</div></div><div class="formgrid"><div class="field"><label>গ্রাহকের নাম</label><input id="buyerName" value="${esc(currentCustomer()?.name||'')}" autocomplete="name"></div><div class="field"><label>মোবাইল</label><input id="buyerPhone" value="${esc(currentCustomer()?.phone||'')}" placeholder="01XXXXXXXXX" inputmode="tel" autocomplete="tel"></div></div><div class="field"><label>সম্পূর্ণ ঠিকানা</label><textarea id="buyerAddress" placeholder="বাড়ি/রোড, এলাকা, থানা, জেলা" autocomplete="street-address"></textarea></div><div class="field"><label>পেমেন্ট পদ্ধতি</label><label style="font-weight:500"><input id="payCOD" type="checkbox" checked disabled style="width:auto"> Cash on Delivery (পণ্য হাতে পেয়ে মূল্য পরিশোধ)</label></div><div class="field"><label>অগ্রিম জমা (৳) — না দিলে ০</label><input id="buyerAdvance" type="number" min="0" value="0"></div><button onclick="checkout()" ${!db.cart.length?'disabled':''}>অর্ডার জমা দিন</button></div>`}
function qtyCart(id,v){let c=db.cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(c)c.qty=Math.max(1,Math.min(p.stock,Number(v)||1));save();render()}
function removeCart(id){db.cart=db.cart.filter(c=>c.id!==id);save();render()}
function checkout(){let name=document.getElementById('buyerName').value.trim(),phone=document.getElementById('buyerPhone').value.trim(),address=document.getElementById('buyerAddress')?.value.trim()||'',cod=true,advance=Number(document.getElementById('buyerAdvance')?.value||0);if(!name||!phone||!address)return alert('নাম, মোবাইল ও ঠিকানা দিন');for(let c of db.cart){let p=db.products.find(x=>x.id===c.id);if(!p||!p.active||p.stock<c.qty)return alert('স্টক পর্যাপ্ত নেই: '+(p?.name||''))}let items=db.cart.map(c=>{let p=db.products.find(x=>x.id===c.id);return {id:p.id,name:p.name,qty:c.qty,price:price(p),cost:Number(p.cost||0)}}),total=items.reduce((s,x)=>s+x.qty*x.price,0);if(advance<0||advance>total)return alert('অগ্রিম টাকা মোট টাকার বেশি হতে পারবে না');db.orders.unshift({id:'SUN-'+Date.now().toString().slice(-7),name,phone,address,items,total,advance,balance:total-advance,status:'Pending',date:new Date().toLocaleString('bn-BD'),type:'Customer',payment:'Cash on Delivery',codAmount:total-advance,courierStatus:'Not Booked'});db.currentCustomerPhone=phone;let logged=db.customers.find(c=>c.phone===phone);if(logged)db.currentCustomerId=logged.id;db.cart=[];log('Order Created',name+' • '+money(total));save();alert('অর্ডার মেমো তৈরি হয়েছে। Admin Approval-এর অপেক্ষায়।');go('orders')}
function orders(){let all=role==='customer'?db.orders.filter(o=>{let c=currentCustomer();return c&&(o.phone===c.phone||o.phone===db.currentCustomerPhone)}):db.orders;let list=all;if(role==='manager'&&orderFilter==='pending')list=list.filter(o=>o.status==='Pending');else if(orderFilter==='customer')list=list.filter(o=>(o.type||'Customer')==='Customer');else if(orderFilter==='superdealer')list=list.filter(o=>o.type==='Super Dealer');else if(orderFilter==='dealer')list=list.filter(o=>o.type==='Dealer');else if(role==='manager'&&orderFilter==='all')list=list;let title=role==='manager'?(orderFilter==='pending'?'Pending Orders':orderFilter==='customer'?'Customer Orders':orderFilter==='superdealer'?'Super Dealer Orders':orderFilter==='dealer'?'Dealer Orders':'সব অর্ডার'):'Orders';let tabs=role==='manager'||role==='admin'?`<div class="row section"><button class="${orderFilter==='all'?'':'secondary'}" onclick="orderFilter='all';render()">সব</button><button class="${orderFilter==='pending'?'':'secondary'}" onclick="orderFilter='pending';render()">Pending (${db.orders.filter(o=>o.status==='Pending').length})</button><button class="secondary" onclick="orderFilter='customer';render()">Customer</button><button class="secondary" onclick="orderFilter='superdealer';render()">Super Dealer</button><button class="secondary" onclick="orderFilter='dealer';render()">Dealer</button></div>`:'';return `<div class="pagehead"><h2>${title}</h2>${role==='admin'?'<button onclick="go(\'courier\')">🚚 Courier Booking & Tracking</button>':''}</div>${tabs}${list.length?`<div class="tablewrap"><table><tr><th>Order ID</th><th>ধরন</th><th>গ্রাহক / ডিলার</th><th>পণ্য</th><th>মোট</th><th>পেমেন্ট</th><th>অবস্থা</th><th>Courier / Tracking</th><th>তারিখ</th>${role==='admin'?'<th>কাজ</th>':''}</tr>${list.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.type||'Customer')}</td><td>${esc(o.name)}<br>${esc(o.phone)}</td><td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(o.total)}</td><td>${esc(o.payment||'Cash on Delivery')}<br><small>বাকি COD: ${money(o.codAmount??(o.total-(o.advance||0)))}</small></td><td><span class="pill ${o.status==='Approved'?'green':o.status==='Rejected'?'red':'orange'}">${esc(o.status)}</span></td><td>${esc(o.courierName||'বুকিং হয়নি')}<br>${esc(o.courierStatus||'Not Booked')}<br>${o.trackingCode?`<b>${esc(o.trackingCode)}</b>${o.trackingUrl?`<br><a href="${esc(o.trackingUrl)}" target="_blank" rel="noopener">ট্র্যাক করুন</a>`:''}`:'—'}${role==='admin'&&o.status==='Approved'?`<br><button class="secondary" onclick="courierForm('${o.id}')">${o.courierName?'ট্র্যাকিং আপডেট':'কুরিয়ার বুকিং'}</button>`:''}</td><td>${esc(o.date)}</td>${role==='admin'?`<td>${o.status==='Pending'?`<button class="good" onclick="approve('${o.id}')">Approve</button> <button class="danger" onclick="reject('${o.id}')">Reject</button>`:'—'}</td>`:''}</tr>`).join('')}</table></div>`:'<div class="empty card">এই বিভাগে কোনো অর্ডার নেই</div>'}`}
function courier(){if(role!=='admin')return '<div class="empty card">এই অংশটি শুধু Admin-এর জন্য</div>';let eligible=db.orders.filter(o=>o.status==='Approved');return `<div class="pagehead"><h2>Courier Booking & Tracking</h2><span class="pill green">Approved Orders: ${eligible.length}</span></div><div class="notice">অর্ডার Approve হওয়ার পর কুরিয়ার সার্ভিসে বুকিং দিয়ে এখানে বুকিং রেফারেন্স, ট্র্যাকিং নম্বর ও ট্র্যাকিং লিংক সংরক্ষণ করুন। এই Local Demo নিজে থেকে কুরিয়ার বুক করে না; API/অ্যাকাউন্ট সংযোগ হলে স্বয়ংক্রিয় বুকিং চালু করা যাবে।</div><div class="tablewrap"><table><tr><th>Order ID</th><th>Customer</th><th>COD</th><th>Courier</th><th>Tracking ID</th><th>Status</th><th>Action</th></tr>${eligible.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.name)}<br>${esc(o.phone)}</td><td>${money(o.codAmount??(o.total-(o.advance||0)))}</td><td>${esc(o.courierName||'—')}</td><td>${esc(o.trackingCode||'—')}</td><td>${esc(o.courierStatus||'Not Booked')}</td><td><button onclick="courierForm('${o.id}')">${o.courierName?'Edit Tracking':'Book Courier'}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">কুরিয়ার বুকিংয়ের জন্য আগে Admin-কে অর্ডার Approve করতে হবে।</td></tr>'}</table></div>`}
function courierForm(id){if(role!=='admin')return alert('শুধু Admin কুরিয়ার বুকিং/ট্র্যাকিং আপডেট করতে পারবেন');let o=db.orders.find(x=>x.id===id);if(!o||o.status!=='Approved')return alert('শুধু Approved অর্ডারে কুরিয়ার বুকিং করা যাবে');showModal(`<h3>কুরিয়ার বুকিং ও ট্র্যাকিং</h3><p class="muted">Order: ${esc(o.id)} • ${esc(o.name)} • COD ${money(o.codAmount??(o.total-(o.advance||0)))}</p><div class="field"><label>কুরিয়ার সার্ভিস</label><select id="courierName"><option ${o.courierName==='Pathao'?'selected':''}>Pathao</option><option ${o.courierName==='Steadfast'?'selected':''}>Steadfast</option><option ${o.courierName==='RedX'?'selected':''}>RedX</option><option ${o.courierName==='Paperfly'?'selected':''}>Paperfly</option><option ${o.courierName==='Sundarban'?'selected':''}>Sundarban</option><option ${o.courierName==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>কুরিয়ার বুকিং রেফারেন্স</label><input id="courierRef" value="${esc(o.courierRef||'')}" placeholder="Booking ID"></div><div class="field"><label>Tracking Number / Consignment ID</label><input id="trackingCode" value="${esc(o.trackingCode||'')}" placeholder="Tracking number"></div><div class="field"><label>Tracking URL</label><input id="trackingUrl" type="url" value="${esc(o.trackingUrl||'')}" placeholder="https://... "></div><div class="field"><label>ডেলিভারি অবস্থা</label><select id="courierStatus">${['Booked','Picked Up','In Transit','At Destination','Out for Delivery','Delivered','Returned','Cancelled'].map(x=>`<option ${o.courierStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>COD আদায়ের পরিমাণ (৳)</label><input id="codAmount" type="number" min="0" value="${Number(o.codAmount??(o.total-(o.advance||0)))}"></div><div class="row"><button onclick="saveCourier('${o.id}')">তথ্য সংরক্ষণ</button><button class="secondary" onclick="closeModal()">বন্ধ</button></div>`)}
function saveCourier(id){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let o=db.orders.find(x=>x.id===id);if(!o)return;let url=document.getElementById('trackingUrl').value.trim();if(url&&!/^https:\/\//i.test(url))return alert('Tracking URL অবশ্যই https:// দিয়ে শুরু হতে হবে');let amount=Number(document.getElementById('codAmount').value);if(!Number.isFinite(amount)||amount<0)return alert('সঠিক COD পরিমাণ দিন');o.courierName=document.getElementById('courierName').value;o.courierRef=document.getElementById('courierRef').value.trim();o.trackingCode=document.getElementById('trackingCode').value.trim();o.trackingUrl=url;o.courierStatus=document.getElementById('courierStatus').value;o.codAmount=amount;o.courierUpdatedAt=new Date().toLocaleString('bn-BD');log('Courier Tracking Updated',o.id+' • '+o.courierName+' • '+o.courierStatus);save();closeModal();page='courier';render()}
function approve(id){if(role!=='admin')return alert('শুধু Admin অর্ডার অনুমোদন করতে পারবেন');let o=db.orders.find(x=>x.id===id);if(!o||o.status!=='Pending')return;for(let i of o.items){let p=db.products.find(x=>x.id===i.id);if(!p||p.stock<i.qty)return alert('স্টক কম: '+i.name)}o.items.forEach(i=>db.products.find(p=>p.id===i.id).stock-=i.qty);o.status='Approved';let customer=db.customers.find(c=>c.phone===o.phone)||{id:'SUN'+Date.now().toString().slice(-6),name:o.name,phone:o.phone,points:0};if(!db.customers.some(c=>c.phone===o.phone))db.customers.push(customer);customer.points+=Math.floor(o.total/100*db.pointsPer100);if(db.currentCustomerPhone===o.phone){db.currentCustomerId=customer.id;}log('Order Approved',id);save();render()}
function reject(id){if(role!=='admin')return alert('শুধু Admin অর্ডার বাতিল করতে পারবেন');let o=db.orders.find(x=>x.id===id);if(o){o.status='Rejected';log('Order Rejected',id);save();render()}}
function points(){let me=currentCustomer()||{points:0},pts=me.points||0,rank=[...db.rankRules].sort((a,b)=>a.points-b.points).filter(r=>pts>=r.points).at(-1)?.name||'Member';return `<div class="pagehead"><h2>My Points & পদবি</h2></div><div class="grid"><div class="card"><div class="muted">আপনার পয়েন্ট</div><div class="stat">${pts.toLocaleString('en-US')}</div></div><div class="card"><div class="muted">বর্তমান পদবি</div><div class="stat">${rank}</div></div></div><div class="card section rank"><h3>🏅 পদবি ও পয়েন্ট টেবিল</h3><div class="tablewrap"><table><tr><th>ক্রম</th><th>পদবি</th><th>প্রয়োজনীয় পয়েন্ট</th></tr>${[...db.rankRules].sort((a,b)=>a.points-b.points).map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.points.toLocaleString('en-US')} PV</td></tr>`).join('')}</table></div><p class="muted small">প্রতি ১০০ টাকা অনুমোদিত কেনাকাটায় ${db.pointsPer100} পয়েন্ট। পদবি ও টার্গেট Admin পরিবর্তন করতে পারবেন।</p></div><div class="card section"><h3>শেয়ার পয়েন্ট</h3><p class="muted">ডেমো পরীক্ষার জন্য একবার শেয়ার পয়েন্ট যোগ হবে। প্রকৃত শেয়ার যাচাই সার্ভার থেকে করতে হবে।</p><button onclick="claimShare()">🔗 শেয়ার পয়েন্ট দাবি করুন (+${db.sharePoints})</button></div>`}
function claimShare(){let me=currentCustomer();if(!me)return alert('প্রথমে Customer Login করুন');if(db.shareClaims.includes(me.id))return alert('এই অ্যাকাউন্টে শেয়ার পয়েন্ট আগে নেওয়া হয়েছে');db.shareClaims.push(me.id);me.points=(me.points||0)+db.sharePoints;log('Share Points Claimed','Demo');save();render()}
function media(){return `<div class="pagehead"><h2>Media & Live Programs</h2>${role==='admin'?'<button onclick="mediaForm()">+ লিংক যোগ</button>':''}</div><div class="grid">${db.media.map((m,i)=>`<div class="card"><div class="stat">${['📘','▶️','🎤','📹'][i%4]}</div><h3>${esc(m.name)}</h3>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">লিংক খুলুন ↗</a>`:'<span class="muted">লিংক পরে Admin যোগ করবেন</span>'}${role==='admin'?`<button class="secondary" style="margin-left:8px" onclick="editMedia(${i})">Edit</button>`:''}</div>`).join('')}</div>`}
function bulk(){return `<div class="pagehead"><h2>Dealer Bulk Order</h2></div><div class="card"><p class="muted">এক অর্ডারে একাধিক পণ্য ও পরিমাণ দিন। ডেমোতে ডিলার মূল্য সাধারণ বিক্রয়মূল্যের সমান; Admin পরে আলাদা Dealer Price নির্ধারণ করতে পারবেন।</p><div id="bulkRows">${bulkRow()}</div><button class="secondary" onclick="document.getElementById('bulkRows').insertAdjacentHTML('beforeend',${JSON.stringify(bulkRow())})">+ আরেকটি পণ্য</button><div class="field" style="margin-top:12px"><label>ডিলারের নাম</label><input id="bulkName" value="Demo Dealer"></div><div class="field"><label>মোবাইল</label><input id="bulkPhone" placeholder="01XXXXXXXXX"></div><div class="field"><label>ঠিকানা</label><textarea id="bulkAddress" placeholder="ডিলারের ঠিকানা"></textarea></div><button onclick="submitBulk()">Bulk Order জমা দিন</button></div>`}
function bulkRow(){return `<div class="row" style="margin:8px 0"><select class="bulkProd" style="flex:2;padding:10px;border:1px solid #d5dfed;border-radius:10px">${db.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input class="bulkQty" type="number" min="1" value="1" style="width:75px;padding:10px;border:1px solid #d5dfed;border-radius:10px"></div>`}
function submitBulk(){let rows=[...document.querySelectorAll('#bulkRows .row')],items=rows.map(r=>{let p=db.products.find(x=>x.id===Number(r.querySelector('.bulkProd').value));return p?{id:p.id,name:p.name,qty:Number(r.querySelector('.bulkQty').value)||1,price:price(p),cost:Number(p.cost||0)}:null}).filter(Boolean);if(!items.length)return;let name=document.getElementById('bulkName').value,phone=document.getElementById('bulkPhone').value,address=document.getElementById('bulkAddress').value;if(!name||!phone||!address)return alert('নাম, মোবাইল ও ঠিকানা দিন');for(let i of items){let p=db.products.find(x=>x.id===i.id);if(!p||p.stock<i.qty)return alert('স্টক পর্যাপ্ত নেই: '+i.name)}let total=items.reduce((s,i)=>s+i.qty*i.price,0);db.orders.unshift({id:'DL-'+Date.now().toString().slice(-7),name,phone,address,items,total,status:'Pending',date:new Date().toLocaleString('bn-BD'),type:'Dealer',advance:0,balance:total,payment:'Cash on Delivery'});log('Dealer Bulk Order',name);save();alert('ডিলার অর্ডার জমা হয়েছে');go('orders')}
function dealers(){return `<div class="pagehead"><h2>Dealers</h2>${role==='admin'?'<button onclick="dealerForm()">+ Dealer যোগ</button>':''}</div>${simpleTable(db.dealers,['id','name','phone'])}`}
function customers(){return `<div class="pagehead"><h2>Customers</h2><button onclick="customerForm()">+ Customer যোগ</button></div>${simpleTable(db.customers,['id','name','phone','points'])}`}
function simpleTable(arr,keys){return `<div class="tablewrap"><table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>${arr.map(x=>`<tr>${keys.map(k=>`<td>${esc(x[k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${keys.length}" class="empty">কোনো তথ্য নেই</td></tr>`}</table></div>`}
function reports(){let approved=db.orders.filter(o=>o.status==='Approved'),sum=approved.reduce((s,o)=>s+o.total,0),gross=approved.reduce((s,o)=>s+o.items.reduce((a,i)=>a+(Number(i.price)-Number(i.cost||0))*i.qty,0),0);return `<div class="pagehead"><h2>Reports</h2></div><div class="grid"><div class="card"><div class="muted">অনুমোদিত বিক্রয়</div><div class="stat">${money(sum)}</div></div><div class="card"><div class="muted">অনুমোদিত অর্ডার</div><div class="stat">${approved.length}</div></div><div class="card"><div class="muted">পণ্য সংখ্যা</div><div class="stat">${db.products.length}</div></div><div class="card"><div class="muted">আনুমানিক মোট লাভ</div><div class="stat">${money(gross)}</div></div></div><div class="section">${simpleTable(approved.map(o=>({id:o.id,name:o.name,total:money(o.total),date:o.date})),['id','name','total','date'])}</div>`}
function print(){let approved=db.orders.filter(o=>o.status==='Approved');return `<div class="pagehead"><h2>Manager Memo Preview & Print</h2></div><div class="notice">শুধু Admin Approved মেমো এখানে আসবে। Manager শুধু Preview ও Print করতে পারবেন।</div>${approved.map(o=>`<div class="card between"><div><b>${o.id}</b><div class="muted">${esc(o.name)} • ${money(o.total)}</div></div><button onclick="previewMemo('${o.id}')">View / Print</button></div>`).join('')||'<div class="empty card">এখনো Admin Approved মেমো নেই</div>'}`}
function memoMarkup(o){return `<div class="memo"><div class="memohead"><b>SUN Product</b><div class="memocust"><b>Customer Details</b><br>নাম: ${esc(o.name)}<br>মোবাইল: ${esc(o.phone)}<br>ঠিকানা: ${esc(o.address||'—')}<br>তারিখ ও সময়: ${esc(o.date)}</div></div><div class="watermark">SUN</div><h2 style="text-align:center">ORDER MEMO</h2><p>Memo No: ${esc(o.id)} <span style="float:right">${esc(o.payment||'Cash on Delivery')}</span></p><p>মোট আইটেম: ${o.items.reduce((n,i)=>n+Number(i.qty||0),0)}</p><table><tr><th>পণ্যের নাম</th><th>পরিমাণ</th><th>একক মূল্য</th><th>মোট</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table><h3 style="text-align:right">সর্বমোট: ${money(o.total)}</h3><p style="text-align:right">অগ্রিম: ${money(o.advance||0)}<br><b>বাকি / Cash on Delivery: ${money(o.balance??(o.total-(o.advance||0)))}</b></p><p>পেমেন্ট: ${esc(o.payment||'Cash on Delivery')}</p><p style="text-align:center;margin-top:50px">ধন্যবাদ • SUN Product</p></div>`}
function previewMemo(id){let o=db.orders.find(x=>x.id===id);if(!o||o.status!=='Approved')return;showModal(`<div class="between"><h3>মেমো প্রিভিউ</h3><button class="secondary" onclick="closeModal()">বন্ধ</button></div>${memoMarkup(o)}<button style="width:100%;margin-top:12px" onclick="printMemo('${id}')">🖨️ Print Memo</button>`)}
function printMemo(id){let o=db.orders.find(x=>x.id===id);if(!o||o.status!=='Approved')return;let w=window.open('','_blank');if(!w)return alert('Print window blocked. Browser pop-up allow করুন।');w.document.write('<html><head><meta charset="utf-8"><title>SUN Memo</title><style>body{font-family:Arial,sans-serif;padding:25px;color:#26384d}.memo{position:relative;border:1px solid #ddd;padding:25px}.memohead{display:flex;justify-content:space-between;gap:20px}.memohead>b{font-size:25px;color:#3976b9}.memocust{text-align:right;line-height:1.7}.watermark{position:absolute;top:42%;left:30%;font-size:100px;font-weight:900;color:#3976b9;opacity:.07;z-index:-1}.memo table{width:100%;border-collapse:collapse;margin-top:25px}.memo th,.memo td{border:1px solid #ccc;padding:10px;text-align:left}.memo th{background:#eff7ff}@media print{body{padding:0}}</style></head><body>'+memoMarkup(o)+'</body></html>');w.document.close();w.focus();w.print()}
function team(){return `<div class="pagehead"><h2>Team Income & Verified Sales</h2></div><div class="notice">শুধু Admin যাচাইকৃত প্রকৃত বিক্রির ভিত্তিতে টিম বোনাস অনুমোদন করবেন। Demo-তে কমিশন হার নির্ধারিত নয়।</div><div class="card"><h3>যাচাইকৃত বিক্রির রেকর্ড</h3><div class="field"><label>সদস্য/টিম লিডার</label><input id="teamName" placeholder="নাম বা ID"></div><div class="field"><label>যাচাইকৃত বিক্রির পরিমাণ (৳)</label><input id="teamSale" type="number" min="0"></div><button onclick="addTeamSale()">রেকর্ড যোগ</button></div>${simpleTable(db.teamSales,['name','amount','verified','date'])}`}
function addTeamSale(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let n=document.getElementById('teamName').value,a=Number(document.getElementById('teamSale').value);if(!n||a<=0)return alert('সঠিক তথ্য দিন');db.teamSales.unshift({name:n,amount:a,verified:'Admin Verified',date:new Date().toLocaleString('bn-BD')});log('Verified Team Sale Added',n+' '+a);save();render()}

active?'danger':'good'}" onclick="toggleProduct(${p.id})">${p.active?'Off':'On'}</button></div></div>`).join('')}</div><div class="section card"><h3>অ্যাপের কালার পরিবর্তন</h3><p class="muted small">পছন্দের রং নির্বাচন করে Save Colors চাপুন।</p><div class="formgrid"><div class="field"><label>অ্যাপের ব্যাকগ্রাউন্ড</label><input id="cBg" type="color" value="${db.settings.bgColor||'#ffffff'}"></div><div class="field"><label>হেডার কালার</label><input id="cHeader" type="color" value="${db.settings.headerColor||'#eaf6ff'}"></div><div class="field"><label>প্রধান বাটন কালার</label><input id="cPrimary" type="color" value="${db.settings.primaryColor||'#78b9f2'}"></div><div class="field"><label>গাঢ় নীল</label><input id="cDark" type="color" value="${db.settings.darkColor||'#2f72b8'}"></div><div class="field"><label>গোল্ডেন / অ্যাকসেন্ট</label><input id="cAccent" type="color" value="${db.settings.accentColor||'#e7b84f'}"></div><div class="field"><label>SUN নামের লেখার রং</label><input id="cBrandText" type="color" value="${db.settings.brandTextColor||'#183c63'}"></div><div class="field"><label>Digital Business Platform লেখার রং</label><input id="cTagline" type="color" value="${db.settings.taglineColor||'#f5bd35'}"></div><div class="field"><label>লোগোর নিচের লেখার সাইজ</label><select id="cTaglineSize"><option value="16" ${Number(db.settings.taglineSize)===16?'selected':''}>16 px</option><option value="18" ${Number(db.settings.taglineSize||18)===18?'selected':''}>18 px</option><option value="20" ${Number(db.settings.taglineSize)===20?'selected':''}>20 px</option><option value="22" ${Number(db.settings.taglineSize)===22?'selected':''}>22 px</option><option value="24" ${Number(db.settings.taglineSize)===24?'selected':''}>24 px</option></select></div></div><button onclick="saveColors()">Save Colors</button><button class="secondary" onclick="db.settings={...db.settings,bgColor:'#ffffff',headerColor:'#eaf6ff',primaryColor:'#78b9f2',darkColor:'#2f72b8',accentColor:'#e7b84f'};save();render()">ডিফল্ট কালার</button></div><div class="section card"><h3>হোম পেজ ব্যানার</h3><p class="muted small">ব্যানার নির্বাচন করে সংরক্ষণ করুন।</p><div class="field"><label>ব্যানার ছবি আপলোড</label><input id="bannerFile" type="file" accept="image/*"><small class="muted">ছবি নির্বাচন করে তারপর “ব্যানার সংরক্ষণ” চাপুন।</small></div><div class="row"><button onclick="saveBanner()">ব্যানার সংরক্ষণ</button><button class="secondary" onclick="removeBanner()">ব্যানার বাদ</button></div></div><div class="section card"><h3>SUN Logo & App Background</h3><p class="muted small">লোগো নির্বাচন করে সংরক্ষণ করুন।</p><div class="field"><label>লোগোর সাইজ</label><select id="logoSize" onchange="setLogoSize(this.value)"><option value="50" ${Number(db.settings.logoSize)===50?'selected':''}>50 × 50 px</option><option value="56" ${Number(db.settings.logoSize)===56?'selected':''}>56 × 56 px</option><option value="64" ${Number(db.settings.logoSize)===64?'selected':''}>64 × 64 px</option><option value="72" ${Number(db.settings.logoSize)===72?'selected':''}>72 × 72 px</option><option value="80" ${Number(db.settings.logoSize)===80?'selected':''}>80 × 80 px</option></select></div><div class="field"><label>নতুন SUN লোগো আপলোড (PNG/JPG/WebP)</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><small class="muted">ছবি নির্বাচন করে তারপর “লোগো সংরক্ষণ” চাপুন।</small></div><div class="row"><button onclick="saveLogo()">লোগো সংরক্ষণ</button><button class="secondary" onclick="removeLogo()">ডিফল্ট SUN লোগো</button></div><div class="field" style="margin-top:14px"><label><input id="whiteBg" type="checkbox" style="width:auto" ${db.settings.whiteBackground!==false?'checked':''} onchange="setWhiteBackground(this.checked)"> অ্যাপের ব্যাকগ্রাউন্ড সাদা রাখুন</label></div></div><div class="section card"><h3>Admin / Manager Password</h3><button class="secondary" onclick="changePass(&quot;admin&quot;)">Admin Password</button> <button class="secondary" onclick="changePass(&quot;manager&quot;)">Manager Password</button></div><div class="section card"><h3>Data Backup & Restore</h3><p class="muted small">সব ডেমো ডেটা JSON ফাইলে ডাউনলোড বা পুনরুদ্ধার করুন।</p><div class="row"><button onclick="backup()">Backup Download</button><label class="secondary" style="padding:10px 14px;border-radius:12px;cursor:pointer">Restore JSON <input type="file" accept="application/json" hidden onchange="restore(event)"></label></div></div>`}
function productForm(p={}){if(role!=='admin')return;showModal(`<h3>${p.id?'পণ্য সম্পাদনা':'নতুন পণ্য যোগ'}</h3><div class="field"><label>পণ্যের নাম</label><input id="fName" value="${esc(p.name||'')}" placeholder="যেমন SUN Detergent"></div><div class="field"><label>ক্যাটাগরি</label><select id="fCat"><option value="SUN Products" ${p.category==='SUN Products'||!p.category?'selected':''}>SUN Products</option><option value="SUN Reselling" ${p.category==='SUN Reselling'?'selected':''}>SUN Reselling</option><option value="Other Products" ${p.category==='Other Products'?'selected':''}>Other Products</option></select></div><div class="field"><label>সাইজ / ওজন / পরিমাণ</label><input id="fWeight" value="${esc(p.weight||'')}" placeholder="যেমন 500g, 1kg, 500ml"></div><div class="field"><label>বিক্রয় মূল্য / রেট (৳)</label><input id="fPrice" type="number" min="0" value="${p.price??''}" placeholder="পণ্যের দাম"></div><div class="field"><label>স্টক / পরিমাণ</label><input id="fStock" type="number" min="0" value="${p.stock??0}"></div><div class="field"><label>পণ্যের ছবি আপলোড</label><input id="fPhoto" type="file" accept="image/*"><small class="muted">ছবি ৫০ MB পর্যন্ত নির্বাচন করা যাবে; অ্যাপ নিজে ছোট করে সংরক্ষণ করবে।</small></div><div class="row"><button onclick="saveProduct(${p.id||0})">পণ্য সংরক্ষণ</button><button class="secondary" onclick="closeModal()">বাতিল</button></div>`)}
function editProduct(id){productForm(db.products.find(p=>p.id===id))}
function saveProduct(id){if(role!=='admin')return alert('শুধু Admin পণ্য যোগ করতে পারবেন');let p=db.products.find(x=>x.id===id)||{id:Date.now(),active:true,icon:''};p.name=document.getElementById('fName').value.trim();p.category=document.getElementById('fCat').value;p.price=Number(document.getElementById('fPrice').value);p.discountType='none';p.discount=0;p.stock=Number(document.getElementById('fStock').value||0);p.weight=document.getElementById('fWeight').value.trim();p.desc='';if(!p.name||document.getElementById('fPrice').value===''||!Number.isFinite(p.price)||p.price<0||!Number.isFinite(p.stock)||p.stock<0)return alert('পণ্যের নাম, সঠিক রেট ও স্টক দিন');let file=document.getElementById('fPhoto').files[0];if(file&&!file.type.startsWith('image/'))return alert('শুধু ছবি ফাইল নির্বাচন করুন');const finish=()=>{if(!db.products.some(x=>x.id===p.id))db.products.push(p);try{save();log('Product Saved',p.name);closeModal();render();alert('পণ্য সংরক্ষণ হয়েছে।')}catch(e){alert('ফোনের স্টোরেজে জায়গা নেই। ব্যাকআপ নিয়ে পুরোনো ছবি সরিয়ে আবার চেষ্টা করুন।')}};if(file){if(file.size>50*1024*1024)return alert('ছবির সাইজ ৫০ MB-এর কম রাখুন');compressImage(file,480,.56,90000,data=>{db.photos=db.photos||{};db.photos[p.id]=data;finish()},()=>alert('ছবি প্রসেস করা যায়নি। JPG/PNG ছবি দিয়ে আবার চেষ্টা করুন।'))}else finish()}
function compressImage(file,maxSide,quality,targetBytes,onDone,onError){let reader=new FileReader();reader.onerror=onError;reader.onload=()=>{let img=new Image();img.onerror=onError;img.onload=()=>{let scale=Math.min(1,maxSide/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let q=quality,data='';for(let attempt=0;attempt<8;attempt++){let ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',q);if(data.length<=targetBytes)break;if(q>.38)q-=.07;else{canvas.width=Math.max(1,Math.round(canvas.width*.82));canvas.height=Math.max(1,Math.round(canvas.height*.82));q=quality*.72}}if(!data||data.length>targetBytes*1.5)return onError(new Error('Image too large after compression'));onDone(data)};img.src=reader.result};reader.readAsDataURL(file)}

function toggleProduct(id){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let p=db.products.find(x=>x.id===id);p.active=!p.active;log('Product Availability Changed',p.name+' '+p.active);save();render()}
function customerForm(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');showModal(`<h3>Customer যোগ</h3><div class="field"><label>নাম</label><input id="cName"></div><div class="field"><label>মোবাইল</label><input id="cPhone"></div><div class="field"><label>পয়েন্ট</label><input id="cPoints" type="number" value="0"></div><button onclick="saveCustomer()">Save</button>`)}
function saveCustomer(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let name=document.getElementById('cName').value,phone=document.getElementById('cPhone').value;if(!name||!phone)return alert('নাম ও ফোন দিন');db.customers.push({id:'SUN'+Date.now().toString().slice(-6),name,phone,points:Number(document.getElementById('cPoints').value)||0});log('Customer Added',name);save();closeModal();render()}
function dealerForm(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');showModal(`<h3>Dealer যোগ</h3><div class="field"><label>নাম</label><input id="dName"></div><div class="field"><label>মোবাইল</label><input id="dPhone"></div><button onclick="saveDealer()">Save</button>`)}
function saveDealer(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let name=document.getElementById('dName').value,phone=document.getElementById('dPhone').value;if(!name||!phone)return;db.dealers.push({id:'DL'+Date.now().toString().slice(-6),name,phone});log('Dealer Added',name);save();closeModal();render()}
function rankForm(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');showModal(`<h3>Rank & Points</h3><p class="muted">প্রতিটি পদের নাম ও প্রয়োজনীয় পয়েন্ট দিন।</p>${db.rankRules.map((r,i)=>`<div class="formgrid"><div class="field"><label>পদের নাম</label><input id="rn${i}" value="${esc(r.name)}"></div><div class="field"><label>পয়েন্ট</label><input id="rp${i}" type="number" value="${r.points}"></div></div>`).join('')}<button onclick="saveRanks()">Save Ranks</button>`)}
function saveRanks(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');db.rankRules=db.rankRules.map((r,i)=>({name:document.getElementById('rn'+i).value,points:Number(document.getElementById('rp'+i).value)||0}));db.rankRules.sort((a,b)=>a.points-b.points);log('Rank Rules Updated');save();closeModal();render()}
function settingsForm(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');showModal(`<h3>Business Settings</h3><div class="field"><label>প্রতি ১০০ টাকা কেনাকাটায় পয়েন্ট</label><input id="sRate" type="number" value="${db.pointsPer100}"></div><div class="field"><label>শেয়ার পয়েন্ট</label><input id="sShare" type="number" value="${db.sharePoints}"></div><button onclick="saveSettings()">Save</button>`)}
function saveSettings(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');db.pointsPer100=Number(document.getElementById('sRate').value)||0;db.sharePoints=Number(document.getElementById('sShare').value)||0;log('Settings Updated');save();closeModal();render()}
function mediaForm(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');showModal(`<h3>Media Link যোগ</h3><div class="field"><label>নাম</label><input id="mName"></div><div class="field"><label>URL</label><input id="mUrl"></div><button onclick="db.media.push({name:document.getElementById('mName').value,url:document.getElementById('mUrl').value});log('Media Link Added');save();closeModal();render()">Save</button>`)}
function editMedia(i){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let m=db.media[i];showModal(`<h3>Media Edit</h3><div class="field"><label>নাম</label><input id="mName" value="${esc(m.name)}"></div><div class="field"><label>URL</label><input id="mUrl" value="${esc(m.url)}"></div><button onclick="db.media[${i}]={name:document.getElementById('mName').value,url:document.getElementById('mUrl').value};log('Media Updated');save();closeModal();render()">Save</button>`)}
function updates(){return `<div class="pagehead"><h2>SUN Smart Update</h2><span class="pill green">Version ${esc(db.version)}</span></div><div class="card"><h3>Version Control</h3><p>${esc(db.releaseNotes)}</p><div class="notice">এই ডেমোতে ভার্সন নোট, ডেটা ব্যাকআপ ও রিস্টোর পরীক্ষা করা যাবে। আসল অ্যাপ কোড আপডেট GitHub Pages-এ নতুন কোড প্রকাশ করে হবে; Firebase যোগ হলে ডেটা migration ও server-side backup যুক্ত করতে হবে।</div>${role==='admin'?`<div class="field"><label>নতুন Version</label><input id="newVersion" placeholder="যেমন 1.1.0"></div><div class="field"><label>Update Notes</label><textarea id="newNotes"></textarea></div><button onclick="publishVersion()">Publish Version Note</button>`:''}</div><div class="card section"><h3>Version History</h3>${db.updates.map(u=>`<p><b>${esc(u.version)}</b> — ${esc(u.notes)} <span class="muted">${esc(u.date)}</span></p>`).join('')||'<p class="muted">কোনো নতুন ভার্সন নোট নেই।</p>'}</div>`}
function publishVersion(){let v=document.getElementById('newVersion').value.trim(),n=document.getElementById('newNotes').value.trim();if(!v)return alert('Version দিন');db.updates.unshift({version:db.version,notes:db.releaseNotes,date:new Date().toLocaleDateString('bn-BD')});db.version=v;db.releaseNotes=n;log('Version Note Published',v);save();render()}
function winners(){return `<div class="pagehead"><h2>মাসিক ৩ জন বিজয়ী</h2>${role==='admin'?'<button onclick="winnerForm()">+ বিজয়ী যোগ</button>':''}</div><div class="grid">${[0,1,2].map(n=>{let w=db.winners[n];return `<div class="card" style="text-align:center"><div class="muted">Winner ${n+1}</div>${w?.photo?`<img src="${w.photo}" style="width:100px;height:100px;border-radius:50%;object-fit:cover">`:'<div style="font-size:55px">🏆</div>'}<h3>${esc(w?.name||'বিজয়ীর নাম')}</h3><p class="muted">${esc(w?.title||'পুরস্কার / পদবি')}</p></div>`}).join('')}</div>`}
function winnerForm(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');showModal(`<h3>বিজয়ীর ছবি ও তথ্য আপলোড</h3><div class="field"><label>বিজয়ী</label><select id="wIndex"><option value="0">১ম বিজয়ী</option><option value="1">২য় বিজয়ী</option><option value="2">৩য় বিজয়ী</option></select></div><div class="field"><label>নাম</label><input id="wName"></div><div class="field"><label>পুরস্কার / পদবি</label><input id="wTitle"></div><div class="field"><label>ছবি</label><input id="wPhoto" type="file" accept="image/*"></div><button onclick="saveWinner()">Save Winner</button>`)}
function saveWinner(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let f=document.getElementById('wPhoto').files[0],idx=Number(document.getElementById('wIndex').value);if(!f)return alert('ছবি নির্বাচন করুন');let r=new FileReader();r.onload=()=>{db.winners[idx]={name:document.getElementById('wName').value,title:document.getElementById('wTitle').value,photo:r.result};log('Winner Updated','Winner '+(idx+1));save();closeModal();render()};r.readAsDataURL(f)}
function audit(){return `<div class="pagehead"><h2>Audit Log</h2></div><div class="notice">Admin-এর গুরুত্বপূর্ণ কার্যক্রমের ডেমো রেকর্ড।</div>${db.logs.length?`<div class="tablewrap"><table><tr><th>সময়</th><th>Mode</th><th>Action</th><th>Details</th></tr>${db.logs.map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.role)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</table></div>`:'<div class="empty card">এখনো কোনো লগ নেই</div>'}`}
function changePass(k){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let old=db.auth?.[k];if(old&&prompt('বর্তমান পাসওয়ার্ড দিন')!==old)return alert('বর্তমান পাসওয়ার্ড মেলেনি');let n=prompt('নতুন পাসওয়ার্ড দিন');if(!n)return;db.auth=db.auth||{};db.auth[k]=n;save();alert('পাসওয়ার্ড পরিবর্তন হয়েছে')}
function backup(){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SUN-My-Business-backup.json';a.click();URL.revokeObjectURL(a.href);log('Backup Downloaded')}
function restore(e){if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.orders)throw Error();db=d;save();alert('Backup Restore সম্পন্ন');render()}catch(err){alert('ভুল বা অসম্পূর্ণ Backup ফাইল')}};r.readAsText(f)}
function showModal(s){document.getElementById('modalbox').innerHTML=s;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('roleSelect').addEventListener('change',e=>{let next=e.target.value;if(next==='admin'||next==='manager'){db.auth=db.auth||{};if(!db.auth[next]){let pw=prompt(next.toUpperCase()+' প্যানেলের নতুন পাসওয়ার্ড সেট করুন');if(!pw){e.target.value=role;return}db.auth[next]=pw;save()}else if(prompt(next.toUpperCase()+' প্যানেলের পাসওয়ার্ড দিন')!==db.auth[next]){alert('ভুল পাসওয়ার্ড');e.target.value=role;return}}role=next;page='home';render()});
document.getElementById('resetDemo').addEventListener('click',()=>{if(role!=='admin')return alert('শুধু Admin এই কাজ করতে পারবেন');if(confirm('সব ডেমো ডেটা মুছে ডিফল্টে ফিরবেন?')){db=structuredClone(defaults);save();role='customer';page='home';render()}});
window.addEventListener('storage',()=>{db=load();render()});
render();
</script></body></html>
